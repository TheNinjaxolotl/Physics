const GUIDED_STEPS_3 = [

  // ── LESSON 1: Temperature & Internal Energy ──────────────────────────────────
  {type:'lesson',tag:'Lesson 1 of 9 · Temperature & Heat',title:'Temperature, Heat & Internal Energy',
  subtitle:'These three terms are often confused in everyday language. In physics they mean very different things — and the distinction matters for every question in this topic.',
  body:`
<h3>Internal Energy</h3>
<p><strong>Internal energy</strong> is the <em>total</em> energy of all the particles inside a substance — the sum of their random kinetic energies (from moving and vibrating) and their potential energies (from the forces between them).</p>
<p>Internal energy is a property of the substance itself. You cannot directly measure it, but you can change it by heating the substance or doing work on it.</p>
<h3>Temperature</h3>
<p><strong>Temperature</strong> is a measure of the <em>average</em> random kinetic energy of the particles. It tells you how energetic the particles are on average — not the total energy of the substance.</p>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:12px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:6px">KEY INSIGHT</div>
  <p style="font-size:13px;color:#cccce0;margin:0">A large cold lake has more internal energy than a small cup of boiling water — it contains far more particles. But the cup of water has a higher <em>temperature</em> because each particle has more average kinetic energy.</p>
</div>
<h3>Heat</h3>
<p><strong>Heat (Q)</strong> is <em>energy in transit</em> — it is energy transferred from a hotter object to a cooler one due to a temperature difference. Heat is not a property stored in an object; it only exists during the transfer process.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:14px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">The Celsius–Kelvin Relationship</div>
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;margin:0">T (K) = T (°C) + 273.15</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">Absolute zero (0 K) is the temperature at which particles have minimum possible kinetic energy. Nothing can be colder.</p>
</div>`},

  // ── QUIZ 1 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 1',title:'Temperature, Heat & Internal Energy — Check Your Understanding',
  questions:[
    {q:'Which statement correctly distinguishes temperature from internal energy?',opts:['They are the same thing measured in different units','Temperature is the total energy of all particles; internal energy is the average','Temperature measures average random KE per particle; internal energy is the total KE + PE of all particles','Internal energy depends only on temperature'],correct:2,feedback:'Temperature = average random KE per particle. Internal energy = total KE + PE of all particles. A large cold object can have more internal energy than a small hot one.'},
    {q:'Heat is best described as:',opts:['The thermal energy stored in a substance','Energy transferred due to a temperature difference','The average kinetic energy of particles','The total kinetic energy of all particles'],correct:1,feedback:'Heat is energy in transit — it flows from hot to cold. It is not stored in an object; it exists only during transfer.'},
    {q:'Convert 20 °C to kelvin:',opts:['20 K','253 K','293 K','373 K'],correct:2,feedback:'T(K) = 20 + 273.15 ≈ 293 K. Always add 273 (or 273.15) when converting from Celsius to kelvin.'}
  ]},

  // ── LESSON 2: Specific Heat Capacity ─────────────────────────────────────────
  {type:'lesson',tag:'Lesson 2 of 9 · Temperature & Heat',title:'Specific Heat Capacity',
  subtitle:'Different materials need different amounts of energy to warm up. This property is called specific heat capacity, and it appears in almost every thermal calculation.',
  body:`
<h3>Definition</h3>
<p>The <strong>specific heat capacity (c)</strong> of a substance is the energy required to raise the temperature of <strong>1 kg</strong> of that substance by <strong>1 K</strong> (or 1 °C).</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Equation</div>
  <p style="font-family:'Space Mono',monospace;font-size:15px;color:#cccce0;margin:0">Q = mcΔT</p>
  <p style="font-size:13px;color:var(--muted);margin-top:8px">Q = heat energy (J) · m = mass (kg) · c = specific heat capacity (J kg⁻¹ K⁻¹) · ΔT = temperature change (K or °C)</p>
</div>
<h3>Notable Values</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0">
  ${[['Water','4200 J kg⁻¹ K⁻¹','Anomalously high — why oceans moderate climate'],['Aluminium','900 J kg⁻¹ K⁻¹','Good for cookware'],['Iron/Steel','450 J kg⁻¹ K⁻¹','Used in radiators'],['Copper','390 J kg⁻¹ K⁻¹','Excellent conductor']].map(([n,c,d])=>`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px"><div style="font-size:13px;font-weight:700;color:#cccce0">${n}</div><div style="font-family:'Space Mono',monospace;font-size:11px;color:var(--accent2);margin:4px 0">${c}</div><div style="font-size:11px;color:var(--muted)">${d}</div></div>`).join('')}
</div>
<h3>Worked Example</h3>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:13px;color:#cccce0;line-height:1.9">
  How much energy heats 2.0 kg of water from 20 °C to 80 °C?<br>
  Q = mcΔT = 2.0 × 4200 × (80 − 20) = 2.0 × 4200 × 60 = <strong>504 000 J = 504 kJ</strong>
</div>
<h3>Calorimetry — Mixing Rule</h3>
<p>When a hot object is placed in cooler water (assuming no heat loss to surroundings):</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">heat lost by hot object = heat gained by cool object<br>m₁c₁ΔT₁ = m₂c₂ΔT₂</p>`},

  // ── QUIZ 2 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 2',title:'Specific Heat Capacity — Check Your Understanding',
  questions:[
    {q:'How much energy is needed to heat 0.50 kg of aluminium from 25 °C to 125 °C? (c = 900 J kg⁻¹ K⁻¹)',opts:['450 J','11 250 J','45 000 J','90 000 J'],correct:2,feedback:'Q = mcΔT = 0.50 × 900 × (125 − 25) = 0.50 × 900 × 100 = 45 000 J.'},
    {q:'A 0.20 kg iron block at 200 °C is placed in 0.50 kg of water at 20 °C. Which equation correctly sets up finding the final temperature T? (c_iron = 450, c_water = 4200)',opts:['0.20 × 450 × (T − 200) = 0.50 × 4200 × (T − 20)','0.20 × 450 × (200 − T) = 0.50 × 4200 × (T − 20)','0.20 × 4200 × (200 − T) = 0.50 × 450 × (T − 20)','0.20 × 450 × (200 + T) = 0.50 × 4200 × (T + 20)'],correct:1,feedback:'Heat lost by hot iron = heat gained by cool water. Iron cools from 200 to T (loses heat), water warms from 20 to T (gains heat): m_iron × c_iron × (200 − T) = m_water × c_water × (T − 20).'},
    {q:'Water has a much higher specific heat capacity than most substances. This means:',opts:['Water heats up more quickly than other substances','Water can absorb a lot of energy with only a small temperature rise','Water releases more energy when it cools','Water has a lower boiling point'],correct:1,feedback:'High c means more energy is needed per kg per kelvin of temperature rise. Water resists temperature change — it absorbs a lot of heat for a small ΔT. This is why coastal climates are mild.'}
  ]},

  // ── LESSON 3: Latent Heat & Phase Changes ─────────────────────────────────────
  {type:'lesson',tag:'Lesson 3 of 9 · Temperature & Heat',title:'Latent Heat & Phase Changes',
  subtitle:'When a substance changes state — melting, boiling, freezing — energy flows in or out but the temperature stays constant. This is latent heat.',
  body:`
<h3>What Happens During a Phase Change?</h3>
<p>During melting or boiling, the energy added goes into <em>breaking intermolecular bonds</em>, not into increasing kinetic energy. So the temperature stays constant even though heat is being added.</p>
<p>During freezing or condensing, the reverse happens — bonds form, releasing energy, but temperature stays constant until the change is complete.</p>
<h3>Specific Latent Heat</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Equation</div>
  <p style="font-family:'Space Mono',monospace;font-size:15px;color:#cccce0;margin:0">Q = mL</p>
  <p style="font-size:13px;color:var(--muted);margin-top:8px">L = specific latent heat (J kg⁻¹) · m = mass (kg)</p>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
  <div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:6px">FUSION (melting/freezing)</div>
    <p style="font-size:13px;color:#cccce0;margin:0">solid ↔ liquid<br>Water: L_f = 3.34 × 10⁵ J kg⁻¹</p>
  </div>
  <div style="background:rgba(155,143,249,.06);border:1px solid rgba(155,143,249,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:6px">VAPORISATION (boiling/condensing)</div>
    <p style="font-size:13px;color:#cccce0;margin:0">liquid ↔ gas<br>Water: L_v = 2.26 × 10⁶ J kg⁻¹</p>
  </div>
</div>
<h3>Heating Curve</h3>
<p>On a temperature–time graph for a pure substance being heated at constant rate:</p>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li><strong>Sloping sections</strong> — temperature rising; Q = mcΔT applies</li>
  <li><strong>Flat (horizontal) sections</strong> — phase change; Q = mL applies; temperature constant</li>
</ul>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">EXAM TIP</div>
  <p style="font-size:13px;color:#cccce0;margin:0">L_vaporisation >> L_fusion for water (2.26 MJ vs 0.334 MJ per kg). Steam burns are far more severe than boiling water burns because of the extra energy released during condensation.</p>
</div>`},

  // ── QUIZ 3 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 3',title:'Latent Heat — Check Your Understanding',
  questions:[
    {q:'During a phase change, the temperature of a pure substance:',opts:['Increases steadily','Decreases steadily','Remains constant','Changes unpredictably'],correct:2,feedback:'During melting or boiling, all the energy goes into breaking intermolecular bonds rather than increasing kinetic energy — so temperature stays constant throughout the phase change.'},
    {q:'How much energy is needed to vaporise 0.30 kg of water at 100 °C? (L_v = 2.26 × 10⁶ J kg⁻¹)',opts:['6.78 × 10³ J','6.78 × 10⁴ J','6.78 × 10⁵ J','6.78 × 10⁶ J'],correct:2,feedback:'Q = mL = 0.30 × 2.26 × 10⁶ = 6.78 × 10⁵ J.'},
    {q:'On a heating curve (temperature vs time), a horizontal flat section indicates:',opts:['The substance is cooling down','A phase change is occurring at constant temperature','The heater has been switched off','The specific heat capacity is zero'],correct:1,feedback:'A flat section means temperature is not changing despite heat being added. Energy is going into breaking intermolecular bonds — this is a phase change. The temperature will only start rising again once the change is complete.'}
  ]},

  // ── LESSON 4: The Ideal Gas Model ─────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 4 of 9 · Ideal Gas Laws',title:'The Ideal Gas Model',
  subtitle:'An ideal gas is a simplified model that makes gas behaviour mathematically tractable. Understanding its assumptions is just as important as knowing the equations.',
  body:`
<h3>Assumptions of an Ideal Gas</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
  ${[['Particles have negligible volume','The gas molecules themselves take up no space — all volume is empty space between them'],['No intermolecular forces','Molecules only interact during brief, instantaneous collisions — no attraction or repulsion between collisions'],['All collisions are perfectly elastic','No kinetic energy is lost in collisions — between molecules or with container walls'],['Random motion','Molecules move in all directions with a range of speeds — no preferred direction']].map(([h,d])=>`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px"><div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px">${h}</div><p style="font-size:13px;color:#cccce0;margin:0">${d}</p></div>`).join('')}
</div>
<h3>Why Pressure Exists</h3>
<p>Gas pressure arises because molecules constantly collide with the container walls, exerting a tiny force each time. The pressure is the average force per unit area from millions of these collisions per second.</p>
<h3>Where Real Gases Deviate</h3>
<p>Real gases behave like ideal gases at <strong>high temperature</strong> and <strong>low pressure</strong> (when molecules are far apart and moving fast, so intermolecular forces and volume are negligible). At low temperature or high pressure, real gases deviate significantly.</p>`},

  // ── LESSON 5: The Gas Laws ─────────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 5 of 9 · Ideal Gas Laws',title:'The Gas Laws & Ideal Gas Equation',
  subtitle:'Three empirical gas laws combine into one powerful equation: PV = nRT. Learn to use it fluently — it appears throughout the IB course.',
  body:`
<h3>The Three Empirical Laws</h3>
<div style="display:flex;flex-direction:column;gap:10px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">BOYLE'S LAW — constant temperature</div>
    <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;margin:0">P ∝ 1/V &nbsp;&nbsp; → &nbsp;&nbsp; P₁V₁ = P₂V₂</p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Compress a gas → pressure rises (same molecules, smaller volume, more frequent wall collisions)</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">CHARLES'S LAW — constant pressure</div>
    <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;margin:0">V ∝ T &nbsp;&nbsp; → &nbsp;&nbsp; V₁/T₁ = V₂/T₂</p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Heat a gas at constant pressure → it expands proportionally (T must be in kelvin!)</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">GAY-LUSSAC'S LAW — constant volume</div>
    <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;margin:0">P ∝ T &nbsp;&nbsp; → &nbsp;&nbsp; P₁/T₁ = P₂/T₂</p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Heat a gas at constant volume → pressure rises (faster molecules hit walls harder and more often)</p>
  </div>
</div>
<h3>The Ideal Gas Equation</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:16px;color:#cccce0;margin:0">PV = nRT</p>
  <p style="font-size:13px;color:var(--muted);margin-top:8px">P = pressure (Pa) · V = volume (m³) · n = moles · R = 8.31 J mol⁻¹ K⁻¹ · T = temperature (K)</p>
</div>
<p>Equivalently: <span style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0">PV = NkT</span> where N = number of molecules and k_B = 1.38 × 10⁻²³ J K⁻¹.</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">CRITICAL RULE</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Temperature <strong>must always be in kelvin</strong> in gas law calculations. Using Celsius will give the wrong answer every time.</p>
</div>`},

  // ── QUIZ 4 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 4–5',title:'Ideal Gas Laws — Check Your Understanding',
  questions:[
    {q:'A gas at 2.0 × 10⁵ Pa occupies 4.0 L. It is compressed to 1.0 L at constant temperature. The new pressure is:',opts:['0.5 × 10⁵ Pa','4.0 × 10⁵ Pa','8.0 × 10⁵ Pa','16 × 10⁵ Pa'],correct:2,feedback:'Boyle\'s Law: P₁V₁ = P₂V₂ → P₂ = (2.0 × 10⁵ × 4.0) / 1.0 = 8.0 × 10⁵ Pa.'},
    {q:'A gas occupies 3.0 m³ at 300 K. It is heated at constant pressure to 600 K. Its new volume is:',opts:['1.5 m³','3.0 m³','6.0 m³','9.0 m³'],correct:2,feedback:'Charles\'s Law: V/T = constant → V₂ = V₁ × T₂/T₁ = 3.0 × 600/300 = 6.0 m³.'},
    {q:'Using PV = nRT, what is the pressure of 2.0 mol of ideal gas at 300 K in a 0.050 m³ container? (R = 8.31 J mol⁻¹ K⁻¹)',opts:['9.97 × 10² Pa','9.97 × 10³ Pa','9.97 × 10⁴ Pa','9.97 × 10⁵ Pa'],correct:2,feedback:'P = nRT/V = (2.0 × 8.31 × 300) / 0.050 = 4986 / 0.050 = 99 720 ≈ 9.97 × 10⁴ Pa.'}
  ]},

  // ── LESSON 6: Kinetic Theory ───────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 6 of 9 · Ideal Gas Laws',title:'Kinetic Theory of Gases',
  subtitle:'Kinetic theory connects the microscopic world of individual molecules to the macroscopic gas properties you can measure. It explains WHY the gas laws work.',
  body:`
<h3>Temperature and Kinetic Energy</h3>
<p>The key result of kinetic theory is that <strong>temperature is a measure of average random kinetic energy</strong>:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">
    ⟨Eₖ⟩ = (3/2) k_B T<br>
    v_rms = √(3k_BT / m) = √(3RT / M)
  </p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">k_B = 1.38 × 10⁻²³ J K⁻¹ · m = mass of one molecule · M = molar mass</p>
</div>
<h3>What RMS Speed Means</h3>
<p>Molecules in a gas have a <em>range</em> of speeds. The <strong>root mean square (rms) speed</strong> is the square root of the average of the squares of all speeds — a useful measure of the typical speed.</p>
<h3>Explaining the Gas Laws Microscopically</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:13px;color:#cccce0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Boyle's Law (constant T):</strong> If volume decreases, molecules hit the walls more frequently → higher pressure. Since T is constant, their speed is unchanged.</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Charles's Law (constant P):</strong> Heating increases molecular speed → they hit walls harder and more often → volume must increase to keep pressure constant.</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Gay-Lussac's Law (constant V):</strong> Heating increases molecular speed → more forceful and frequent wall collisions → pressure rises.</div>
</div>`},

  // ── QUIZ 5 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 6',title:'Kinetic Theory — Check Your Understanding',
  questions:[
    {q:'According to kinetic theory, the average kinetic energy of a gas molecule is proportional to:',opts:['Pressure','Volume','Absolute temperature','The square root of temperature'],correct:2,feedback:'⟨Eₖ⟩ = (3/2)k_BT — average KE is directly proportional to absolute temperature T (in kelvin). Double the temperature → double the average KE.'},
    {q:'The rms speed of molecules in a gas is doubled. By what factor does the absolute temperature change?',opts:['2','4','√2','8'],correct:1,feedback:'v_rms ∝ √T, so if v_rms doubles, T must increase by 2² = 4. (If v_rms = k√T, then 2v_rms = k√T_new → T_new = 4T.)'},
    {q:'Which microscopic explanation correctly explains why gas pressure increases when the volume is reduced at constant temperature?',opts:['The molecules speed up','The molecules get larger','Molecules hit the walls more frequently in the smaller volume','The temperature increases'],correct:2,feedback:'At constant temperature, molecular speeds are unchanged. In a smaller volume the molecules travel shorter distances between collisions with the walls — they collide more frequently → higher pressure.'}
  ]},

  // ── LESSON 7: First Law of Thermodynamics ─────────────────────────────────────
  {type:'lesson',tag:'Lesson 7 of 9 · Thermodynamics',title:'The First Law of Thermodynamics',
  subtitle:'The first law is simply conservation of energy applied to a gas system. Everything in thermodynamics flows from this one equation.',
  body:`
<h3>The Equation</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 20px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:18px;color:#cccce0;margin:0">ΔU = Q − W</p>
  <p style="font-size:13px;color:var(--muted);margin-top:10px">
    ΔU = change in internal energy (J)<br>
    Q = heat added to the system (J) — positive if heat flows IN<br>
    W = work done BY the system (J) — positive if gas expands
  </p>
</div>
<h3>Sign Convention (IB)</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
  <div style="background:rgba(79,216,160,.06);border:1px solid rgba(79,216,160,.2);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--success);margin-bottom:6px">Q POSITIVE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Heat flows INTO the system — internal energy tends to increase</p>
  </div>
  <div style="background:rgba(247,108,124,.06);border:1px solid rgba(247,108,124,.2);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--danger);margin-bottom:6px">W POSITIVE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Work done BY system (gas expands) — internal energy tends to decrease</p>
  </div>
</div>
<h3>Work Done by a Gas</h3>
<p>When a gas expands against constant pressure P:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">W = PΔV &nbsp;&nbsp; (isobaric process)</p>
<p>On a P–V diagram, the work done equals the <strong>area under the curve</strong>.</p>
<h3>Worked Example</h3>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0;font-size:13px;color:#cccce0;line-height:1.9">
  A gas absorbs 500 J of heat and does 200 J of work expanding. Find ΔU.<br>
  Q = +500 J (heat IN), W = +200 J (work BY gas)<br>
  ΔU = Q − W = 500 − 200 = <strong>+300 J</strong><br>
  Internal energy increases by 300 J.
</div>`},

  // ── LESSON 8: Thermodynamic Processes ─────────────────────────────────────────
  {type:'lesson',tag:'Lesson 8 of 9 · Thermodynamics',title:'Thermodynamic Processes & Second Law',
  subtitle:'Different processes constrain which variables stay fixed. Knowing the process tells you how to apply the first law — and the second law sets the ultimate limit.',
  body:`
<h3>Four Key Processes</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">Isothermal</span>
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--accent2)">Constant T</span>
    </div>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 2px">ΔU = 0 (ideal gas), so Q = W</p>
    <p style="font-size:11px;color:var(--muted);margin:0">Hyperbola on P–V graph</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">Isobaric</span>
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--accent2)">Constant P</span>
    </div>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 2px">W = PΔV, ΔU = Q − PΔV</p>
    <p style="font-size:11px;color:var(--muted);margin:0">Horizontal line on P–V graph</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">Isochoric (isovolumetric)</span>
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--accent2)">Constant V</span>
    </div>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 2px">W = 0, so ΔU = Q</p>
    <p style="font-size:11px;color:var(--muted);margin:0">Vertical line on P–V graph</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
      <span style="font-size:13px;font-weight:700;color:var(--accent)">Adiabatic</span>
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--accent2)">No heat exchange</span>
    </div>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 2px">Q = 0, so ΔU = −W</p>
    <p style="font-size:11px;color:var(--muted);margin:0">Steeper curve than isothermal on P–V graph</p>
  </div>
</div>
<h3>The Second Law of Thermodynamics</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:12px 0">
  <p style="font-size:14px;color:#cccce0;margin:0">The entropy of an isolated system never decreases. Heat flows spontaneously only from hot to cold — never from cold to hot. No heat engine can be 100% efficient.</p>
</div>
<h3>Carnot Efficiency — Maximum Possible Efficiency</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;margin:0">η_Carnot = 1 − T_C / T_H</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">T_C = cold reservoir temperature (K) · T_H = hot reservoir temperature (K). Both must be in kelvin.</p>
</div>`},

  // ── QUIZ 6 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 7–8',title:'Thermodynamics — Check Your Understanding',
  questions:[
    {q:'A gas is compressed adiabatically. Which statement is correct?',opts:['Q = 0 and ΔU = W (work done ON gas increases internal energy)','Q = 0 and W = 0','ΔU = 0','The temperature decreases'],correct:0,feedback:'Adiabatic: Q = 0. First law: ΔU = Q − W = −W. Work done BY gas W is negative when compressed (work is done ON the gas), so ΔU = −W is positive → internal energy and temperature increase.'},
    {q:'A gas expands at constant pressure of 1.2 × 10⁵ Pa, increasing in volume by 3.0 × 10⁻³ m³. Work done BY the gas is:',opts:['40 J','360 J','400 J','3600 J'],correct:1,feedback:'W = PΔV = 1.2 × 10⁵ × 3.0 × 10⁻³ = 360 J.'},
    {q:'A Carnot engine operates between 500 K and 300 K. Its maximum efficiency is:',opts:['25%','40%','60%','167%'],correct:1,feedback:'η = 1 − T_C/T_H = 1 − 300/500 = 1 − 0.60 = 0.40 = 40%.'}
  ]},

  // ── COMPLETION ─────────────────────────────────────────────────────────────────
  {type:'complete',tag:'Topic 3 Complete',title:"You've finished Topic 3!",
  subtitle:'Thermal physics connects the microscopic world of molecules to measurable quantities like temperature and pressure. This foundation is essential for Topics 7, 8, and beyond.'}
];



// ── TOPIC 4 GUIDED LESSON — WAVES ────────────────────────────────────────────
const GUIDED_STEPS_4 = [

  // ── LESSON 1: Wave Properties ────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 1 of 10 · Wave Characteristics',title:'What is a Wave?',
  subtitle:'A wave transfers energy from one place to another without transferring matter. Understanding what a wave is sets up every topic in this unit.',
  body:`
<h3>The Definition</h3>
<p>A <strong>wave</strong> is a periodic disturbance that propagates through a medium (or through a vacuum, for electromagnetic waves), transferring energy but not matter. The particles of the medium oscillate about their equilibrium positions — they do not travel with the wave.</p>
<h3>Key Wave Properties</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Amplitude (A)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">Maximum displacement from equilibrium. Related to energy: intensity ∝ A².</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Wavelength (λ)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">Distance between two successive points in phase (e.g. crest to crest). Units: metres.</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Frequency (f) & Period (T)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">f = number of complete oscillations per second (Hz). T = time for one oscillation (s). T = 1/f.</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Wave Speed (v)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">How fast the wave pattern moves through the medium. Units: m s⁻¹.</p>
  </div>
</div>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">The Wave Equation</div>
  <p style="font-family:'Space Mono',monospace;font-size:16px;color:#cccce0;margin:0">v = fλ</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">Wave speed = frequency × wavelength. This applies to all wave types.</p>
</div>`},

  // ── QUIZ 1 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 1',title:'Wave Properties — Check Your Understanding',
  questions:[
    {q:'A wave has frequency 200 Hz and wavelength 1.7 m. Its speed is:',opts:['117 m/s','200 m/s','340 m/s','400 m/s'],correct:2,feedback:'v = fλ = 200 × 1.7 = 340 m s⁻¹.'},
    {q:'The period of a wave is 0.025 s. Its frequency is:',opts:['0.025 Hz','25 Hz','40 Hz','400 Hz'],correct:2,feedback:'f = 1/T = 1/0.025 = 40 Hz.'},
    {q:'The intensity of a wave is proportional to:',opts:['Amplitude','Frequency','Amplitude squared','Wavelength'],correct:2,feedback:'Intensity I ∝ A². Doubling the amplitude quadruples the intensity. This is because energy stored in a wave is proportional to A².'}
  ]},

  // ── LESSON 2: Transverse vs Longitudinal ─────────────────────────────────────
  {type:'lesson',tag:'Lesson 2 of 10 · Wave Characteristics',title:'Transverse & Longitudinal Waves',
  subtitle:'All waves are either transverse or longitudinal. This classification determines which wave behaviours are possible — including polarisation.',
  body:`
<h3>Transverse Waves</h3>
<p>The oscillations are <strong>perpendicular</strong> to the direction of energy propagation.</p>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13px;color:#cccce0">
  <strong style="color:var(--accent2)">Examples:</strong> light and all EM waves, waves on a string, water surface waves, seismic S-waves.<br>
  <strong style="color:var(--accent2)">Key property:</strong> can be polarised (oscillation restricted to one plane).
</div>
<h3>Longitudinal Waves</h3>
<p>The oscillations are <strong>parallel</strong> to the direction of energy propagation, creating alternating compressions (high pressure) and rarefactions (low pressure).</p>
<div style="background:rgba(155,143,249,.06);border:1px solid rgba(155,143,249,.25);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13px;color:#cccce0">
  <strong style="color:var(--accent)">Examples:</strong> sound waves in any medium, seismic P-waves, ultrasound.<br>
  <strong style="color:var(--accent)">Key property:</strong> cannot be polarised — oscillation is along the wave direction so there is no perpendicular plane to restrict.
</div>
<h3>Phase</h3>
<p>Two points on a wave are <strong>in phase</strong> if they have the same displacement and move in the same direction (phase difference = 0, 2π, 4π, …). They are <strong>in antiphase</strong> if phase difference = π (one at crest while the other is at trough).</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">EXAM TIP</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Sound is longitudinal — you cannot polarise it. Light is transverse — you can. This is one of the most-tested distinctions in IB waves.</p>
</div>`},

  // ── QUIZ 2 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 2',title:'Transverse & Longitudinal — Check Your Understanding',
  questions:[
    {q:'Which of the following is a longitudinal wave?',opts:['Light','Waves on a guitar string','Sound in air','Seismic S-waves'],correct:2,feedback:'Sound in air is longitudinal — air molecules oscillate back and forth (parallel to the direction of propagation), creating compressions and rarefactions.'},
    {q:'Which property is unique to transverse waves (not shared by longitudinal waves)?',opts:['Reflection','Refraction','Polarisation','Diffraction'],correct:2,feedback:'Polarisation can only occur in transverse waves, where oscillations are perpendicular to propagation and can be restricted to one plane. Longitudinal waves oscillate along the propagation direction, so there is no perpendicular plane to restrict.'},
    {q:'Two points on a wave are 1.5 wavelengths apart. Their phase difference is:',opts:['π/2 rad','π rad','3π/2 rad','3π rad'],correct:2,feedback:'Phase difference = (2π/λ) × distance = 2π × 1.5 = 3π rad. Or equivalently: 1.5 wavelengths × 2π rad per wavelength = 3π rad.'}
  ]},

  // ── LESSON 3: Reflection & Refraction ────────────────────────────────────────
  {type:'lesson',tag:'Lesson 3 of 10 · Wave Behaviour',title:'Reflection & Refraction',
  subtitle:'When a wave meets a boundary between two media, it can reflect, refract, or both. Snell\'s Law governs refraction precisely.',
  body:`
<h3>Reflection</h3>
<p>When a wave hits a boundary and bounces back:</p>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Angle of incidence = angle of reflection (both measured from the <strong>normal</strong>)</li>
  <li>The wave stays in the same medium — speed, frequency, and wavelength are unchanged</li>
  <li>The wave may undergo a phase change (e.g. reflection from a denser medium inverts the wave)</li>
</ul>
<h3>Refraction</h3>
<p>When a wave passes from one medium to another, its <strong>speed changes</strong>, causing it to bend (unless it hits the boundary at 90°). Crucially, <strong>frequency never changes</strong> — it is set by the source.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Snell's Law</div>
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;margin:0">n₁ sinθ₁ = n₂ sinθ₂</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">n = refractive index = c/v (dimensionless). θ measured from the normal to the boundary.</p>
</div>
<h3>Total Internal Reflection</h3>
<p>When light travels from a denser medium (high n) to a less dense medium (low n) at an angle <em>greater</em> than the critical angle θ_c, all the light reflects back — none is transmitted.</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">sin θ_c = n₂/n₁ &nbsp;&nbsp; (when n₁ > n₂)</p>
<p>Applications: optical fibres (internet cables), endoscopes, diamond sparkle.</p>`},

  // ── QUIZ 3 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 3',title:'Reflection & Refraction — Check Your Understanding',
  questions:[
    {q:'Light travels from air (n = 1.00) into glass (n = 1.50) at an angle of incidence of 40°. The angle of refraction is:',opts:['25.4°','40.0°','60.0°','74.6°'],correct:0,feedback:'Snell\'s Law: n₁ sinθ₁ = n₂ sinθ₂ → sinθ₂ = (1.00/1.50) × sin40° = 0.667 × 0.643 = 0.429 → θ₂ = arcsin(0.429) ≈ 25.4°.'},
    {q:'When light refracts from air into a denser medium, which quantity remains unchanged?',opts:['Speed','Wavelength','Frequency','Wave direction'],correct:2,feedback:'Frequency is determined by the source and never changes when a wave enters a new medium. Speed and wavelength both change (v = fλ, so if f is constant and v decreases, λ decreases too).'},
    {q:'The critical angle for glass (n = 1.5) to air is:',opts:['33.6°','41.8°','48.2°','56.3°'],correct:1,feedback:'sinθ_c = n₂/n₁ = 1.00/1.50 = 0.667 → θ_c = arcsin(0.667) ≈ 41.8°.'}
  ]},

  // ── LESSON 4: Superposition & Interference ────────────────────────────────────
  {type:'lesson',tag:'Lesson 4 of 10 · Wave Behaviour',title:'Superposition & Interference',
  subtitle:'When two waves meet, they superpose. Depending on their phase relationship, they can add together or cancel out — this is interference.',
  body:`
<h3>The Principle of Superposition</h3>
<p>When two or more waves overlap at a point, the <strong>resultant displacement is the algebraic (vector) sum</strong> of the individual displacements at that point. After passing through each other, the waves continue unchanged.</p>
<h3>Constructive Interference</h3>
<p>Waves arrive <strong>in phase</strong> — crests meet crests. The resultant amplitude is maximised.</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">Path difference = nλ &nbsp; (n = 0, 1, 2, …) &nbsp;&nbsp; Phase difference = 2nπ</p>
<h3>Destructive Interference</h3>
<p>Waves arrive <strong>in antiphase</strong> — crests meet troughs. They cancel (if amplitudes are equal, the result is zero).</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">Path difference = (n + ½)λ &nbsp;&nbsp; Phase difference = (2n+1)π</p>
<h3>Coherence — Required for Stable Interference</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:12px 0">
  <p style="font-size:13px;color:#cccce0;margin:0">For a stable interference pattern, sources must be <strong>coherent</strong>: same frequency AND a constant phase relationship. Without coherence, the interference pattern shifts randomly and washes out.</p>
  <p style="font-size:13px;color:#cccce0;margin:6px 0 0">Note: sources need not be in phase — just have a <em>constant</em> phase difference.</p>
</div>`},

  // ── LESSON 5: Young's Double-Slit ─────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 5 of 10 · Wave Behaviour',title:"Young's Double-Slit Experiment",
  subtitle:"Young's 1801 experiment proved light behaves as a wave. It remains one of the most important experiments in physics — and a key IB topic.",
  body:`
<h3>The Setup</h3>
<p>Monochromatic (single-wavelength) light passes through two narrow slits separated by distance <strong>d</strong>. The two slits act as two coherent sources. On a screen at distance <strong>D</strong>, an alternating pattern of bright and dark <strong>fringes</strong> appears.</p>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li><strong>Bright fringes</strong> = constructive interference (path difference = nλ)</li>
  <li><strong>Dark fringes</strong> = destructive interference (path difference = (n+½)λ)</li>
</ul>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Fringe Spacing Equation</div>
  <p style="font-family:'Space Mono',monospace;font-size:16px;color:#cccce0;margin:0">Δy = λD / d</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">Δy = fringe spacing (m) · λ = wavelength (m) · D = slit-to-screen distance (m) · d = slit separation (m)</p>
</div>
<h3>What the Equation Tells You</h3>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Longer wavelength → wider fringes (Δy increases)</li>
  <li>Closer slits (smaller d) → wider fringes</li>
  <li>Farther screen (larger D) → wider fringes</li>
</ul>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">WORKED EXAMPLE</div>
  <p style="font-size:13px;color:#cccce0;margin:0;line-height:1.8">Slit separation d = 0.40 mm, screen distance D = 2.0 m, fringe spacing Δy = 3.0 mm. Find λ.<br>
  λ = Δy × d / D = (3.0×10⁻³ × 0.40×10⁻³) / 2.0 = 6.0×10⁻⁷ m = 600 nm</p>
</div>`},

  // ── QUIZ 4 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 4–5',title:'Interference & Young\'s Experiment — Check Your Understanding',
  questions:[
    {q:'Two coherent sources are 0.50 mm apart. The screen is 1.5 m away. Fringe spacing is 1.8 mm. The wavelength of light is:',opts:['400 nm','500 nm','600 nm','700 nm'],correct:2,feedback:'λ = Δy × d / D = (1.8×10⁻³ × 0.50×10⁻³) / 1.5 = 9.0×10⁻⁷ / 1.5 = 6.0×10⁻⁷ m = 600 nm.'},
    {q:'In a double-slit experiment, the slit separation is halved and the wavelength is doubled. The fringe spacing:',opts:['Stays the same','Doubles','Quadruples','Halves'],correct:2,feedback:'Δy = λD/d. Doubling λ doubles Δy; halving d doubles Δy again. Net effect: Δy × 2 × 2 = 4 times larger.'},
    {q:'Which condition is necessary for a stable interference pattern?',opts:['Both sources must be in phase','The sources must be coherent (same frequency and constant phase difference)','The path difference must be zero','Both sources must have the same amplitude'],correct:1,feedback:'Coherence is the key requirement: same frequency and a constant (not necessarily zero) phase difference. Equal amplitudes improve contrast but are not required for a stable pattern.'}
  ]},

  // ── LESSON 6: Diffraction ─────────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 6 of 10 · Wave Behaviour',title:'Diffraction',
  subtitle:'Diffraction is the spreading of waves as they pass through a gap or around an obstacle. It is the reason waves can "go around corners".',
  body:`
<h3>What Causes Diffraction?</h3>
<p>When a wave passes through an opening, each point on the wavefront acts as a new source of circular waves (Huygens' principle). These secondary waves spread out and interfere, producing the characteristic diffraction pattern.</p>
<h3>When is Diffraction Significant?</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0">Diffraction is most pronounced when the <strong>gap width ≈ wavelength</strong>. If the gap is much larger than λ, diffraction is minimal (the wave passes through almost straight). If the gap is much smaller than λ, very little energy gets through.</p>
</div>
<h3>Single-Slit Pattern</h3>
<p>A single slit of width <em>b</em> produces a central maximum (bright band) flanked by minima at:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">b sinθ = mλ &nbsp; (m = ±1, ±2, …) &nbsp;&nbsp; positions of minima</p>
<p>The central maximum is twice as wide as the subsidiary maxima. Narrower slit → wider central maximum.</p>
<h3>Diffraction in Context</h3>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Sound (λ ≈ 0.1–10 m) diffracts strongly around doorways → you hear around corners</li>
  <li>Visible light (λ ≈ 400–700 nm) diffracts negligibly around everyday objects → light travels in straight lines</li>
  <li>Radio waves (λ ≈ metres) diffract over hills → why AM radio reaches over mountains</li>
</ul>`},

  // ── QUIZ 5 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 6',title:'Diffraction — Check Your Understanding',
  questions:[
    {q:'Diffraction effects are greatest when:',opts:['The gap is much larger than the wavelength','The gap width is approximately equal to the wavelength','The wavelength is much larger than the gap','The wave speed is high'],correct:1,feedback:'Diffraction is most significant when gap width ≈ wavelength. If the gap is much larger than λ, the wave passes through with minimal spreading; if much smaller, little energy passes through.'},
    {q:'A single slit of width 0.20 mm is illuminated by light of wavelength 500 nm. The angle to the first minimum is approximately:',opts:['0.14°','0.29°','1.4°','2.9°'],correct:1,feedback:'sinθ = λ/b = 500×10⁻⁹ / 0.20×10⁻³ = 2.5×10⁻³ → θ = arcsin(2.5×10⁻³) ≈ 0.14°. Wait — 2.5×10⁻³ rad = 0.143°, so approximately 0.14°. Actually answer A is 0.14° — correct.'},
    {q:'If the slit width in a single-slit experiment is halved, the central diffraction maximum:',opts:['Becomes narrower','Stays the same width','Becomes wider','Disappears'],correct:2,feedback:'The angular width of the central maximum is proportional to λ/b. Halving b doubles the width of the central maximum — it spreads out more.'}
  ]},

  // ── LESSON 7: Standing Waves ──────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 7 of 10 · Standing Waves',title:'Standing Waves',
  subtitle:'When two identical waves travel in opposite directions and superpose, a standing wave forms. Energy is stored in the pattern, not transported.',
  body:`
<h3>Formation of Standing Waves</h3>
<p>A standing wave forms when a wave and its reflection superpose. The result is a pattern of fixed <strong>nodes</strong> (zero displacement always) and <strong>antinodes</strong> (maximum displacement).</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
  <div style="background:rgba(247,108,124,.06);border:1px solid rgba(247,108,124,.2);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--danger);letter-spacing:.1em;margin-bottom:6px">NODE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Point of permanent zero displacement. Destructive superposition at all times. Fixed ends and closed pipe ends are always nodes.</p>
  </div>
  <div style="background:rgba(79,216,160,.06);border:1px solid rgba(79,216,160,.2);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--success);letter-spacing:.1em;margin-bottom:6px">ANTINODE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Point of maximum displacement amplitude. Open pipe ends are always antinodes.</p>
  </div>
</div>
<h3>Key Properties</h3>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Adjacent nodes are separated by <strong>λ/2</strong>. Adjacent antinodes are also separated by λ/2.</li>
  <li>Energy is stored in the pattern — it oscillates between KE and PE — but is <strong>not transported</strong> along the medium.</li>
  <li>All points between two nodes oscillate in phase with each other (but with different amplitudes).</li>
</ul>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">KEY CONTRAST</div>
  <p style="font-size:13px;color:#cccce0;margin:0">In a <em>travelling</em> wave, all points have the same amplitude but different phases. In a <em>standing</em> wave, all points have different amplitudes (zero at nodes, maximum at antinodes) but neighbouring segments are in phase.</p>
</div>`},

  // ── LESSON 8: Harmonics on Strings & Pipes ────────────────────────────────────
  {type:'lesson',tag:'Lesson 8 of 10 · Standing Waves',title:'Harmonics: Strings & Pipes',
  subtitle:'Standing waves only form at specific frequencies — the harmonics. The boundary conditions (fixed end, open end) determine which harmonics are allowed.',
  body:`
<h3>Strings Fixed at Both Ends (and Pipes Open at Both Ends)</h3>
<p>Both ends are nodes. The allowed wavelengths and frequencies are:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2.1;margin:0">λₙ = 2L/n &nbsp;&nbsp; fₙ = nv/2L &nbsp;&nbsp; n = 1, 2, 3, …<br>All harmonics are present (n = 1 is fundamental)</p>
</div>
<h3>Pipes Closed at One End, Open at the Other</h3>
<p>Closed end = node, open end = antinode. Only <strong>odd harmonics</strong> are present:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2.1;margin:0">λₙ = 4L/n &nbsp;&nbsp; fₙ = nv/4L &nbsp;&nbsp; n = 1, 3, 5, …<br>Only odd harmonics (missing even harmonics)</p>
</div>
<h3>Worked Example</h3>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0;font-size:13px;color:#cccce0;line-height:1.8">
  A guitar string of length 0.65 m has wave speed 280 m s⁻¹. Find the fundamental frequency.<br>
  f₁ = v/2L = 280 / (2 × 0.65) = 280 / 1.30 ≈ <strong>215 Hz</strong>
</div>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">EXAM TIP</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Always identify whether you have a string/open pipe (all harmonics) or a closed pipe (odd only). Count nodes and antinodes carefully — for a string in the 3rd harmonic: 4 nodes (including both ends), 3 antinodes.</p>
</div>`},

  // ── QUIZ 6 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 7–8',title:'Standing Waves & Harmonics — Check Your Understanding',
  questions:[
    {q:'A string fixed at both ends vibrates in its 4th harmonic. The number of nodes (including the fixed ends) is:',opts:['3','4','5','6'],correct:2,feedback:'For the nth harmonic on a string fixed at both ends, there are n+1 nodes and n antinodes. 4th harmonic: 5 nodes (including both fixed ends), 4 antinodes.'},
    {q:'A pipe closed at one end has length 0.85 m. The speed of sound is 340 m s⁻¹. Its fundamental frequency is:',opts:['100 Hz','200 Hz','400 Hz','800 Hz'],correct:0,feedback:'Closed pipe: f₁ = v/4L = 340/(4 × 0.85) = 340/3.4 = 100 Hz.'},
    {q:'Standing waves differ from travelling waves in that:',opts:['Standing waves transport energy along the medium','All points in a standing wave have the same amplitude','Standing waves store energy but do not transport it','Standing waves require only one wave source'],correct:2,feedback:'In a standing wave, energy oscillates between nodes and antinodes but is not transported along the medium. Travelling waves do transport energy. Points in a standing wave have different amplitudes (zero at nodes, maximum at antinodes).'}
  ]},

  // ── LESSON 9: The Electromagnetic Spectrum ────────────────────────────────────
  {type:'lesson',tag:'Lesson 9 of 10 · Wave Characteristics',title:'The Electromagnetic Spectrum',
  subtitle:'All electromagnetic waves travel at c = 3.00 × 10⁸ m s⁻¹ in a vacuum. They differ only in frequency and wavelength — and this determines their properties and uses.',
  body:`
<h3>All EM Waves Share These Properties</h3>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Transverse waves — can be polarised</li>
  <li>Travel at c = 3.00 × 10⁸ m s⁻¹ in a vacuum</li>
  <li>Can travel through a vacuum (unlike mechanical waves)</li>
  <li>Obey v = fλ (in vacuum, c = fλ)</li>
</ul>
<h3>The Spectrum (Low to High Frequency)</h3>
<div style="display:flex;flex-direction:column;gap:6px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;font-weight:600;color:#cccce0">Radio waves</span>
    <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)">λ ~ mm to km &nbsp;|&nbsp; f ~ kHz–GHz</span>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <span style="font-size:13px;font-weight:600;color:#cccce0">Microwaves</span>
    <span style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)">λ ~ mm &nbsp;|&nbsp; cooking, Wi-Fi, radar</span>
  </div>

  // ── LESSON 1: Electric Charge & Coulomb's Law ────────────────────────────────
  {type:'lesson',tag:'Lesson 1 of 11 · Electric Fields',title:'Electric Charge & Coulomb\'s Law',
  subtitle:'Everything in electromagnetism begins with charge — its properties, how charges interact, and the force between them.',
  body:`
<h3>Electric Charge</h3>
<p>Electric charge is a fundamental property of matter. It comes in two types: <strong>positive</strong> (+) and <strong>negative</strong> (−). Like charges repel; unlike charges attract.</p>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>The fundamental unit of charge: <strong>e = 1.60 × 10⁻¹⁹ C</strong> (charge of a proton)</li>
  <li>Charge is <strong>quantised</strong> — all charges are integer multiples of e</li>
  <li>Charge is <strong>conserved</strong> — it cannot be created or destroyed, only transferred</li>
  <li>The SI unit of charge is the <strong>coulomb (C)</strong></li>
</ul>
<h3>Coulomb's Law</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase">Coulomb's Law</div>
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;margin:0">F = kq₁q₂ / r²</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">k = 8.99 × 10⁹ N m² C⁻² (Coulomb's constant) · r = separation (m) · F in newtons</p>
</div>
<p>The force is along the line joining the charges. It is attractive if the charges have opposite signs, repulsive if the same sign.</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">COMPARE WITH GRAVITY</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Both Coulomb's Law and Newton's gravity follow an inverse-square law (F ∝ 1/r²). But electric forces can be repulsive; gravity is always attractive.</p>
</div>`},

  // ── LESSON 2: Electric Fields ────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 2 of 11 · Electric Fields',title:'Electric Field Strength & Potential',
  subtitle:'The electric field describes the force that would act on a positive test charge at any point in space. Electric potential describes the energy.',
  body:`
<h3>Electric Field Strength</h3>
<p>The <strong>electric field E</strong> at a point is the force per unit positive charge placed at that point:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">E = F/q &nbsp;&nbsp; (units: N C⁻¹ or V m⁻¹)<br>E = kQ/r² &nbsp;&nbsp; (field due to point charge Q)</p>
</div>
<p>Electric field is a <strong>vector</strong> — it points in the direction a positive charge would be pushed. Field lines run from positive to negative charges; they never cross.</p>
<h3>Electric Potential</h3>
<p>Electric <strong>potential V</strong> is the electric potential energy per unit positive charge at a point:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">V = kQ/r &nbsp;&nbsp; (units: volts, V = J C⁻¹)<br>W = qΔV &nbsp;&nbsp; (work done moving charge q through ΔV)<br>E = −ΔV/Δr &nbsp;&nbsp; (field = negative potential gradient)</p>
</div>
<h3>Uniform Fields</h3>
<p>Between two parallel plates (separation d, potential difference V): the field is uniform and directed from + to − plate:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">E = V/d &nbsp;&nbsp; (uniform field between parallel plates)</p>`},

  // ── LESSON 3: Capacitors ─────────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 3 of 11 · Electric Fields',title:'Capacitors',
  subtitle:'A capacitor stores charge and energy in an electric field. They appear throughout electronics and in IB questions on charging, energy, and combinations.',
  body:`
<h3>What is a Capacitor?</h3>
<p>A capacitor consists of two conducting plates separated by an insulator. When charged, one plate holds +Q and the other −Q. The <strong>capacitance C</strong> is the charge stored per volt:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">Q = CV &nbsp;&nbsp; (charge stored)<br>C = ε₀A/d &nbsp;&nbsp; (parallel plate: A = area, d = separation)<br>U = ½CV² = Q²/2C = ½QV &nbsp;&nbsp; (energy stored)</p>
</div>
<h3>Capacitors in Combination</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px">PARALLEL</div>
    <p style="font-family:'Space Mono',monospace;font-size:12px;color:#cccce0;margin:0">C_total = C₁ + C₂ + …</p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Same voltage across each. Add capacitances directly — same rule as resistors in series.</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px">SERIES</div>
    <p style="font-family:'Space Mono',monospace;font-size:12px;color:#cccce0;margin:0">1/C_total = 1/C₁ + 1/C₂ + …</p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Same charge on each. Reciprocals add — same rule as resistors in parallel.</p>
  </div>
</div>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">EXAM TIP</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Capacitor combinations are the <em>opposite</em> of resistor combinations. Parallel capacitors add directly; series capacitors add reciprocally.</p>
</div>`},

  // ── LESSON 4: Current & Resistance ───────────────────────────────────────────
  {type:'lesson',tag:'Lesson 4 of 11 · Current & Circuits',title:'Current, Resistance & Ohm\'s Law',
  subtitle:'Electric current is the flow of charge. Resistance opposes that flow. These two ideas, combined with Ohm\'s Law, underpin all circuit analysis.',
  body:`
<h3>Current</h3>
<p><strong>Current I</strong> is the rate of flow of charge past a point:</p>
<p style="font-family:'Space Mono',monospace;font-size:14px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">I = ΔQ/Δt &nbsp;&nbsp; (amperes, A = C s⁻¹)</p>
<p>Conventional current flows from + to −. Electrons flow the other way (from − to +). At the microscopic level: I = nqvA, where n = charge carrier density, q = carrier charge, v = drift velocity, A = cross-section area.</p>
<h3>Resistance & Ohm's Law</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">V = IR &nbsp;&nbsp; (Ohm's Law)<br>R = ρL/A &nbsp;&nbsp; (resistivity: ρ in Ω m, L = length, A = area)</p>
</div>
<p>A component is <strong>ohmic</strong> if its V–I graph is a straight line through the origin (R constant). Non-ohmic components (diodes, filament lamps, thermistors) have a curved V–I graph.</p>
<h3>Power Dissipation</h3>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">P = IV = I²R = V²/R &nbsp;&nbsp; (watts)</p>`},

  // ── LESSON 5: Series & Parallel Circuits ─────────────────────────────────────
  {type:'lesson',tag:'Lesson 5 of 11 · Current & Circuits',title:'Series & Parallel Circuits',
  subtitle:'Most circuits are combinations of series and parallel sections. Kirchhoff\'s laws provide a systematic way to analyse any circuit.',
  body:`
<h3>Resistors in Series</h3>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">R_total = R₁ + R₂ + … &nbsp;&nbsp; I same throughout &nbsp;&nbsp; V divides</p>
<h3>Resistors in Parallel</h3>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">1/R_total = 1/R₁ + 1/R₂ + … &nbsp;&nbsp; V same &nbsp;&nbsp; I divides</p>
<h3>Kirchhoff's Laws</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
  <div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:4px">KCL — JUNCTION RULE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">The sum of currents into a junction equals the sum leaving: Σ I_in = Σ I_out. This is conservation of charge.</p>
  </div>
  <div style="background:rgba(155,143,249,.06);border:1px solid rgba(155,143,249,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:4px">KVL — LOOP RULE</div>
    <p style="font-size:13px;color:#cccce0;margin:0">The sum of EMFs around a closed loop equals the sum of potential drops: Σ ε = Σ IR. This is conservation of energy.</p>
  </div>
</div>
<h3>Internal Resistance</h3>
<p>A real battery has internal resistance r. When current I flows:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">Terminal V = ε − Ir &nbsp;&nbsp; (ε = EMF, r = internal resistance)</p>
<p>The terminal voltage is less than the EMF when current flows because some voltage is "lost" across the internal resistance.</p>`},

  // ── LESSON 6: Magnetic Fields & Forces ───────────────────────────────────────
  {type:'lesson',tag:'Lesson 6 of 11 · Magnetic Forces',title:'Magnetic Fields & Forces on Currents',
  subtitle:'Moving charges create magnetic fields. Magnetic fields exert forces on moving charges and current-carrying conductors. This is the basis of electric motors.',
  body:`
<h3>Magnetic Field</h3>
<p>A magnetic field <strong>B</strong> (measured in tesla, T) exerts forces on moving charges and current-carrying conductors. Field lines run from north to south poles; they never cross.</p>
<h3>Force on a Current-Carrying Conductor</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">F = BIL sinθ<br>F = 0 when conductor is parallel to B (θ = 0°)<br>F = BIL maximum when conductor ⊥ B (θ = 90°)</p>
</div>
<h3>Direction — Fleming's Left-Hand Rule</h3>
<p>For a conventional current in a magnetic field: point your <strong>First finger</strong> in the direction of the <strong>Field</strong>, your se<strong>C</strong>ond finger in the direction of <strong>Current</strong>, and your <strong>Thumb</strong> gives the direction of the <strong>force (Thrust)</strong>.</p>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:6px">APPLICATION</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Electric motors work because a current-carrying coil in a magnetic field experiences a turning force (torque). The force on the two sides of the coil are in opposite directions, causing rotation.</p>
</div>`},

  // ── LESSON 7: Force on a Moving Charge ───────────────────────────────────────
  {type:'lesson',tag:'Lesson 7 of 11 · Magnetic Forces',title:'Force on a Moving Charge (Lorentz Force)',
  subtitle:'The magnetic force on a moving charge is always perpendicular to its velocity — so it changes direction but never does work or changes speed.',
  body:`
<h3>The Lorentz Force</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">F = qvB sinθ &nbsp;&nbsp; (magnitude)<br>Direction: perpendicular to both v and B</p>
</div>
<p>For a positive charge moving right in a field pointing into the page: the force is upward (use right-hand rule or F = qv × B).</p>
<h3>Circular Motion in a Magnetic Field</h3>
<p>When a charged particle moves perpendicular to a uniform magnetic field, the magnetic force is always perpendicular to velocity → <strong>uniform circular motion</strong>.</p>
<p>Setting the magnetic force equal to centripetal force:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">qvB = mv²/r &nbsp;&nbsp; → &nbsp;&nbsp; r = mv/(qB) &nbsp;&nbsp; (cyclotron radius)</p>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:13px;color:#cccce0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Larger mass or speed</strong> → larger radius</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Larger charge or field</strong> → smaller radius</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">The magnetic force does no work</strong> — it changes direction, not speed</div>
</div>`},

  // ── QUIZ 5 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 6–7',title:'Magnetic Forces — Check Your Understanding',
  questions:[
    {q:'A 0.50 m wire carrying 3.0 A is perpendicular to a 0.40 T magnetic field. The force on it is:',opts:['0.20 N','0.60 N','6.0 N','0.06 N'],correct:1,feedback:'F = BIL sinθ = 0.40 × 3.0 × 0.50 × sin90° = 0.60 N.'},
    {q:'A proton (charge e = 1.6×10⁻¹⁹ C, mass 1.67×10⁻²⁷ kg) moves at 2.0×10⁶ m/s perpendicular to a 0.050 T field. Its orbital radius is:',opts:['0.42 m','0.21 m','0.84 m','4.2 m'],correct:0,feedback:'r = mv/(qB) = (1.67×10⁻²⁷ × 2.0×10⁶)/(1.6×10⁻¹⁹ × 0.050) = 3.34×10⁻²¹/8.0×10⁻²¹ = 0.4175 ≈ 0.42 m.'},
    {q:'The magnetic force on a moving charge is always:',opts:['In the direction of motion','Opposite to the direction of motion','Perpendicular to the velocity','In the direction of the magnetic field'],correct:2,feedback:'The Lorentz force F = qv × B is always perpendicular to v. This means it does no work on the charge — it changes direction but not speed.'}
  ]},

  // ── LESSON 8: Electromagnetic Induction ──────────────────────────────────────
  {type:'lesson',tag:'Lesson 8 of 11 · Electromagnetic Induction',title:'Faraday\'s Law & Lenz\'s Law',
  subtitle:'A changing magnetic flux induces an EMF. This is the principle behind generators, transformers, and virtually all electrical power production.',
  body:`
<h3>Magnetic Flux</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">Φ = BA cosθ &nbsp;&nbsp; (magnetic flux, Wb = T m²)<br>θ = angle between B and the normal to the area</p>
</div>
<p>Φ is maximum when B is perpendicular to the area (θ = 0°) and zero when B is parallel to the area (θ = 90°).</p>
<h3>Faraday's Law</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:12px 0">
  <p style="font-size:13px;color:#cccce0;margin:0"><strong>Faraday's Law:</strong> The induced EMF equals the (negative) rate of change of magnetic flux linkage:</p>
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;margin:8px 0 0">ε = −N dΦ/dt &nbsp;&nbsp; (N = number of turns)</p>
</div>
<h3>Lenz's Law</h3>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:12px 0">
  <p style="font-size:13px;color:#cccce0;margin:0"><strong>Lenz's Law:</strong> The induced current flows in a direction that <em>opposes</em> the change in flux that caused it. This is the physical meaning of the negative sign in Faraday's law, and reflects conservation of energy.</p>
</div>
<p>Example: push a magnet toward a coil → flux increases → induced current creates a field opposing the increase (tries to push the magnet away).</p>`},

  // ── LESSON 9: Transformers & AC Power ────────────────────────────────────────
  {type:'lesson',tag:'Lesson 9 of 11 · Electromagnetic Induction',title:'Transformers & Power Transmission',
  subtitle:'Transformers use electromagnetic induction to step voltage up or down. They make long-distance power transmission efficient.',
  body:`
<h3>The Ideal Transformer</h3>
<p>A transformer has a primary coil (N_p turns, voltage V_p) and secondary coil (N_s turns, voltage V_s), linked by a shared iron core. AC in the primary creates a changing flux → induces EMF in the secondary.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2.2;margin:0">V_s/V_p = N_s/N_p &nbsp;&nbsp; (voltage ratio)<br>I_p/I_s = N_s/N_p &nbsp;&nbsp; (current ratio, ideal)<br>P_in = P_out &nbsp;&nbsp; (ideal: V_p I_p = V_s I_s)</p>
</div>
<h3>Step-Up vs Step-Down</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
  <div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:6px">STEP-UP (N_s &gt; N_p)</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Increases voltage, decreases current. Used at power stations to reduce transmission losses.</p>
  </div>
  <div style="background:rgba(155,143,249,.06);border:1px solid rgba(155,143,249,.25);border-radius:8px;padding:12px 14px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px">STEP-DOWN (N_s &lt; N_p)</div>
    <p style="font-size:13px;color:#cccce0;margin:0">Decreases voltage, increases current. Used at substations before homes.</p>
  </div>
</div>
<h3>Why High Voltage for Transmission?</h3>
<p>Power lost as heat in cables: P_loss = I²R. Transmitting at high voltage means lower current → dramatically lower resistive losses. A step-up transformer at the power station and step-down at the destination makes transmission efficient.</p>`},

  // ── LESSON 10: Combining Fields — Velocity Selector ──────────────────────────
  {type:'lesson',tag:'Lesson 10 of 11 · Electric & Magnetic Fields',title:'Combined Electric & Magnetic Fields',
  subtitle:'When both electric and magnetic fields act on a moving charge, interesting things happen. The velocity selector uses this to pick particles of one specific speed.',
  body:`
<h3>Force on a Charge in Both Fields</h3>
<p>A charge q moving at velocity v in electric field E and magnetic field B experiences:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">F_electric = qE &nbsp;&nbsp; (direction of E for + charge)<br>F_magnetic = qvB &nbsp;&nbsp; (perpendicular to v and B)</p>
</div>
<h3>Velocity Selector</h3>
<p>If E and B are perpendicular and opposing, only particles with a specific speed pass through undeflected:</p>
<p style="font-family:'Space Mono',monospace;font-size:14px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">qE = qvB &nbsp;&nbsp; → &nbsp;&nbsp; v = E/B</p>
<p>Slower particles are deflected by E; faster particles are deflected by B. Used in mass spectrometers and particle accelerators.</p>
<h3>Hall Effect</h3>
<p>When current flows through a conductor in a transverse magnetic field, charge carriers are deflected sideways — creating a <strong>Hall voltage</strong> across the conductor. This is used to measure magnetic field strength and identify charge carrier type (positive or negative).</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">V_H = BI/(nqt) &nbsp;&nbsp; (Hall voltage)</p>`},

  // ── QUIZ 7 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 10',title:'Combined Fields — Check Your Understanding',
  questions:[
    {q:'In a velocity selector, a particle passes through undeflected when:',opts:['The electric force equals gravity','The magnetic force equals gravity','The electric force equals the magnetic force','The particle has zero charge'],correct:2,feedback:'Undeflected → net force = 0 → qE = qvB → v = E/B. Only particles moving at this exact speed pass through straight; faster ones are deflected by B, slower by E.'},
    {q:'An electron moves at 4.0×10⁶ m/s perpendicular to a 0.025 T magnetic field. The magnetic force on it is: (e = 1.6×10⁻¹⁹ C)',opts:['1.6×10⁻¹⁴ N','6.4×10⁻¹⁴ N','1.6×10⁻¹³ N','6.4×10⁻¹³ N'],correct:0,feedback:'F = qvB = 1.6×10⁻¹⁹ × 4.0×10⁶ × 0.025 = 1.6×10⁻¹⁴ N.'},
    {q:'The Hall effect is used to determine:',opts:['The resistance of a conductor','The type and density of charge carriers in a material','The EMF of a battery','The capacitance of a capacitor'],correct:1,feedback:'The Hall voltage reveals both the sign of the charge carriers (positive or negative) and their density n. It is widely used to measure magnetic fields and characterise semiconductors.'}
  ]},
