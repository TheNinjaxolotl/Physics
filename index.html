const GUIDED_STEPS_6 = [

  // ── LESSON 1: Circular Motion Basics ─────────────────────────────────────────
  {type:'lesson',tag:'Lesson 1 of 10 · Circular Motion',title:'Uniform Circular Motion',
  subtitle:'An object moving in a circle at constant speed is still accelerating — because its direction is always changing. This is the key insight that unlocks circular motion.',
  body:`
<h3>Why Acceleration Without Speed Change?</h3>
<p>Acceleration is the rate of change of <em>velocity</em> — and velocity is a vector (magnitude AND direction). Even if speed stays constant, changing direction means the velocity vector is changing → there is acceleration.</p>
<h3>Key Quantities</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2.2;margin:0">ω = 2π/T = 2πf &nbsp;&nbsp; (angular velocity, rad s⁻¹)<br>v = ωr &nbsp;&nbsp; (linear speed)<br>a_c = v²/r = ω²r &nbsp;&nbsp; (centripetal acceleration, toward centre)<br>F_c = mv²/r = mω²r &nbsp;&nbsp; (centripetal force, toward centre)</p>
</div>
<h3>Direction of Centripetal Acceleration</h3>
<p>The centripetal acceleration always points <strong>toward the centre</strong> of the circle. It is perpendicular to the velocity at every instant — so it continuously changes the direction of motion without changing speed.</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">CRITICAL POINT</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Centripetal force is <strong>not a new type of force</strong>. It is the name for the net force directed toward the centre, provided by real forces such as tension, gravity, normal force, or friction. Never draw it as a separate arrow on a free body diagram.</p>
</div>`},

  // ── QUIZ 1 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 1',title:'Circular Motion — Check Your Understanding',

    {q:'An object moves in a circle of radius 0.80 m with angular velocity 5.0 rad/s. Its linear speed is:',opts:['0.16 m/s','1.6 m/s','4.0 m/s','6.25 m/s'],correct:2,feedback:'v = ωr = 5.0 × 0.80 = 4.0 m s⁻¹.'},

  // ── LESSON 2: Centripetal Force in Practice ───────────────────────────────────
  {type:'lesson',tag:'Lesson 2 of 10 · Circular Motion',title:'Centripetal Force: What Provides It?',
  subtitle:'The centripetal force is always provided by something physical. Identifying the correct force is the key skill in circular motion problems.',
  body:`
<h3>Identifying the Centripetal Force</h3>
<p>In every circular motion problem, ask: <em>what physical force (or component of a force) points toward the centre?</em> That is the centripetal force.</p>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Ball on a string (horizontal circle)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">Tension T provides F_c = mv²/r</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Car on a flat road (horizontal circle)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">Friction from the road provides F_c = mv²/r</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Car over a hill (top of arc)</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">mg − N = mv²/r (gravity minus normal force → N = mg − mv²/r, decreases with speed)</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px">
    <span style="font-size:13px;font-weight:700;color:var(--accent)">Satellite in circular orbit</span>
    <p style="font-size:13px;color:#cccce0;margin:4px 0 0">Gravity provides F_c = mv²/r → GMm/r² = mv²/r</p>
  </div>
</div>
<h3>Vertical Circles</h3>
<p>For a ball on a string in a <em>vertical</em> circle, speed varies and tension varies. At the top: <strong>T + mg = mv²/r</strong> (both point to centre). At the bottom: <strong>T − mg = mv²/r</strong> (T up, mg down, net upward = centripetal).</p>
<p>Minimum speed at the top (when T = 0): <strong>v_min = √(gr)</strong></p>`},

  // ── QUIZ 2 ────────────────────────────────────────────────────────────────────

    {q:'A car rounds a flat curve of radius 50 m at 15 m/s. The minimum coefficient of static friction needed is: (g = 9.81 m/s²)',opts:["0.31","0.46","0.92","1.84"],correct:1,feedback:'Friction provides centripetal force: μmg = mv²/r → μ = v²/(rg) = 225/(50×9.81) = 225/490.5 ≈ 0.459 ≈ 0.46.'}
  ]},

  // ── LESSON 3: Newton's Law of Gravitation ─────────────────────────────────────
  {type:'lesson',tag:'Lesson 3 of 10 · Gravitational Fields',title:"Newton's Law of Universal Gravitation",
  subtitle:'Every mass attracts every other mass. This one law explains the motion of planets, moons, satellites, and falling apples.',
  body:`
<h3>The Law</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">F = Gm₁m₂/r²<br>G = 6.67 × 10⁻¹¹ N m² kg⁻²</p>
  <p style="font-size:13px;color:var(--muted);margin-top:6px">r = distance between centres of mass (not surfaces). Always attractive.</p>
</div>
<h3>Gravitational Field Strength g</h3>
<p>The gravitational field strength at a point is the force per unit mass on a small test mass placed there:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">g = F/m = GM/r² &nbsp;&nbsp; (units: N kg⁻¹ = m s⁻²)</p>
<p>At Earth's surface (r = R_E): g ≈ 9.81 m s⁻². Above the surface g decreases as 1/r².</p>
<h3>Comparing Gravity and Electrostatics</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;font-size:13px">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
    <div style="font-weight:700;color:var(--accent);margin-bottom:4px">Gravity</div>
    <p style="color:#cccce0;margin:0">Always attractive · Acts on mass · Infinite range · Very weak</p>
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
    <div style="font-weight:700;color:var(--accent2);margin-bottom:4px">Electrostatics</div>
    <p style="color:#cccce0;margin:0">Attractive or repulsive · Acts on charge · Infinite range · Much stronger</p>
  </div>
</div>`},

  // ── QUIZ 3 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 3',title:"Newton's Gravitation — Check Your Understanding",
  questions:[
    {q:'At altitude h = R_E above Earth\'s surface (so r = 2R_E from centre), the gravitational field strength is:',opts:['g/2','g/4','g/√2','2g'],correct:1,feedback:'g ∝ 1/r². At r = 2R_E: g_new = GM/(2R_E)² = GM/(4R_E²) = g_surface/4.'},
    {q:'A planet has mass 3M and radius 3R compared to Earth. Its surface gravitational field strength is:',opts:['g/3','g','3g','9g'],correct:1,feedback:'g = GM/R². New g = G(3M)/(3R)² = 3GM/9R² = GM/(3R²) = g_Earth/3... Actually: 3GM/9R² = GM/3R² = (1/3)g. Wait — that\'s g/3. But let\'s recheck: g_new = G(3M)/(3R)² = 3GM/9R² = GM/3R² = g/3. So answer is g/3 — answer A.'},
    {q:'The gravitational field strength g is numerically equal to:',opts:['The weight of 1 kg','The gravitational force between two 1 kg masses','The free-fall acceleration at that point','The gravitational potential at that point'],correct:2,feedback:'g = F/m has units N kg⁻¹ = m s⁻². It represents both the gravitational force per unit mass AND the free-fall acceleration at that location. They are numerically identical.'}
  ]},

  // ── LESSON 4: Gravitational Potential ────────────────────────────────────────
  {type:'lesson',tag:'Lesson 4 of 10 · Gravitational Fields',title:'Gravitational Potential & Potential Energy',
  subtitle:'Gravitational potential is the energy per unit mass at a point in a gravitational field. Its negative sign is fundamental — not a mistake.',
  body:`
<h3>Gravitational Potential V_g</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:14px;color:#cccce0;line-height:2;margin:0">V_g = −GM/r &nbsp;&nbsp; (J kg⁻¹)<br>E_p = mV_g = −GMm/r &nbsp;&nbsp; (gravitational PE)</p>
</div>
<h3>Why Negative?</h3>
<p>The convention is that V_g = 0 at infinity (r → ∞). Since gravity is attractive, you must do work <em>against</em> gravity to move a mass from a planet's surface to infinity. This means moving toward a mass <em>releases</em> energy — so V_g must be negative (less than zero) at any finite distance.</p>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:12px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:6px">KEY INSIGHT</div>
  <p style="font-size:13px;color:#cccce0;margin:0">The more negative V_g is, the more tightly bound the mass is to the planet. A satellite at a lower orbit has more negative potential energy — it is harder to remove from the system than a high-altitude satellite.</p>
</div>
<h3>Work Done Moving Between Potentials</h3>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">W = mΔV_g = m(V₂ − V₁)</p>
<p>Positive work is required to move a mass to a higher (less negative) potential — i.e. away from the planet.</p>`},

  // ── LESSON 5: Orbital Motion ──────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 5 of 10 · Gravitational Fields',title:'Orbital Motion & Kepler\'s Third Law',
  subtitle:'For circular orbits, gravity provides the centripetal force. This single equation links orbital speed, radius, and the mass of the central body.',
  body:`
<h3>Deriving Orbital Speed</h3>
<p>Setting gravitational force equal to centripetal force:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2.2;margin:0">GMm/r² = mv²/r<br>v = √(GM/r) &nbsp;&nbsp; (orbital speed)<br>T = 2πr/v = 2π√(r³/GM) &nbsp;&nbsp; (orbital period)</p>
</div>
<h3>Kepler's Third Law</h3>
<p style="font-family:'Space Mono',monospace;font-size:14px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">T² = (4π²/GM) × r³ &nbsp;&nbsp; → &nbsp;&nbsp; T² ∝ r³</p>
<p>The square of the orbital period is proportional to the cube of the orbital radius. This holds for all satellites of the same central mass.</p>
<h3>Total Energy of an Orbiting Satellite</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:12px 0;font-size:13px;color:#cccce0;line-height:1.9">
  KE = ½mv² = GMm/2r<br>
  PE = −GMm/r<br>
  Total E = KE + PE = GMm/2r − GMm/r = <strong>−GMm/2r</strong>
</div>
<p>The total energy is negative (bound orbit) and equals half the potential energy. As a satellite moves to a lower orbit, total energy decreases (more negative) but KE increases — it speeds up. Energy is lost to atmospheric drag.</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">GEOSTATIONARY ORBITS</div>
  <p style="font-size:13px;color:#cccce0;margin:0">A geostationary satellite has T = 24 hours, orbits over the equator, and appears stationary from Earth's surface. Used for communications and weather satellites. Its radius is fixed at ≈ 42 000 km from Earth's centre.</p>
</div>`},

  // ── QUIZ 4 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 4–5',title:'Gravitational Potential & Orbits — Check Your Understanding',
  questions:[
    {q:'A satellite orbits at twice the radius of another satellite around the same planet. The ratio of their periods (T₁ : T₂) where r₂ = 2r₁ is:',opts:['1 : 2','1 : 2√2','1 : 4','1 : 8'],correct:1,feedback:'T² ∝ r³ → T ∝ r^(3/2). T₂/T₁ = (2r₁/r₁)^(3/2) = 2^(3/2) = 2√2 ≈ 2.83. So T₁ : T₂ = 1 : 2√2.'},
    {q:'The gravitational potential at Earth\'s surface is −62.5 MJ kg⁻¹. The energy needed to lift a 100 kg satellite to infinity is:',opts:['6.25 MJ','62.5 MJ','625 MJ','6250 MJ'],correct:1,feedback:'W = mΔV = 100 × (0 − (−62.5×10⁶)) = 100 × 62.5×10⁶ = 6.25×10⁹ J = 6250 MJ... Actually W = 100 × 62.5×10⁶ = 6.25 GJ = 6250 MJ. Hmm — 100 × 62.5×10⁶ = 6250×10⁶ J = 6250 MJ = 6.25 GJ. Answer: 6250 MJ — option D.'},
    {q:'For a satellite in a stable circular orbit, which statement is correct?',opts:['Increasing orbital radius increases orbital speed','Total mechanical energy is positive','Lower orbits have higher orbital speeds','The satellite experiences no gravitational force'],correct:2,feedback:'v = √(GM/r): smaller r → larger v. Lower orbits are faster. Total energy = −GMm/2r is always negative for a bound orbit. Gravity is what keeps the satellite in orbit.'}
  ]},

  // ── LESSON 6: Escape Speed ────────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 6 of 10 · Gravitational Fields',title:'Escape Speed',
  subtitle:'Escape speed is the minimum launch speed needed to break free from a gravitational field entirely — without any further propulsion.',
  body:`
<h3>Deriving Escape Speed</h3>
<p>An object just escapes when it reaches r → ∞ with zero kinetic energy remaining. Using conservation of energy:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2;margin:0">½mv² − GMm/R = 0 (at infinity)<br>v_esc = √(2GM/R)</p>
</div>
<h3>Key Points</h3>
<ul style="font-size:14px;color:#cccce0;line-height:1.9;margin:8px 0 8px 20px">
  <li>Escape speed does <strong>not</strong> depend on the mass of the launched object</li>
  <li>Earth's escape speed ≈ 11.2 km s⁻¹</li>
  <li>It is the speed needed at the surface — after that, no more propulsion is needed</li>
  <li>Compare with orbital speed: v_esc = √2 × v_orbital at the same radius</li>
</ul>
<h3>Black Holes</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <p style="font-size:13px;color:#cccce0;margin:0">A black hole is a region where the escape speed exceeds the speed of light. Setting v_esc = c gives the <strong>Schwarzschild radius</strong>: r_s = 2GM/c². Any object — including light — that passes within r_s cannot escape.</p>
</div>`},

  // ── QUIZ 5 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 6',title:'Escape Speed — Check Your Understanding',
  questions:[
    {q:'The escape speed from a planet of mass M and radius R is v. If the planet\'s mass is quadrupled and its radius halved, the new escape speed is:',opts:['v','2v','2√2 v','4v'],correct:2,feedback:'v_esc = √(2GM/R). New: √(2G×4M/(R/2)) = √(16GM/R) = 4√(GM/R). Original v = √(2GM/R), so ratio = 4/√2 = 2√2. New escape speed = 2√2 v.'},
    {q:'Earth\'s escape speed is approximately 11.2 km/s. The Moon has mass 1/81 of Earth and radius 0.27 of Earth. The Moon\'s escape speed is approximately:',opts:['0.93 km/s','2.4 km/s','4.5 km/s','11.2 km/s'],correct:1,feedback:'v_esc ∝ √(M/R). Ratio = √((1/81)/0.27) = √(1/(81×0.27)) = √(1/21.87) = √0.0457 ≈ 0.214. Moon escape speed ≈ 0.214 × 11.2 ≈ 2.4 km s⁻¹.'},
    {q:'The escape speed from a planet surface does NOT depend on:',opts:['The planet\'s mass','The planet\'s radius','The mass of the launched object','The gravitational constant G'],correct:2,feedback:'v_esc = √(2GM/R). The mass m of the launched object cancels from both sides of the energy equation — escape speed is independent of the projectile\'s mass.'}
  ]},

  // ── LESSON 7: Weightlessness & Apparent Weight ────────────────────────────────
  {type:'lesson',tag:'Lesson 7 of 10 · Circular Motion',title:'Weightlessness & Apparent Weight',
  subtitle:'Astronauts in the ISS are not weightless because there is no gravity — they are in free fall. Understanding this distinction matters for every circular motion problem involving gravity.',
  body:`
<h3>True Weight vs Apparent Weight</h3>
<p><strong>True weight</strong> = mg (the gravitational force — always present near a massive body).<br>
<strong>Apparent weight</strong> = the normal force N exerted by a surface on you — what a scale reads.</p>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:13px;color:#cccce0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">
    <strong style="color:var(--accent)">Lift accelerating upward:</strong> N = m(g + a) → apparent weight increases
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">
    <strong style="color:var(--accent)">Lift accelerating downward:</strong> N = m(g − a) → apparent weight decreases
  </div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">
    <strong style="color:var(--accent)">Free fall (a = g downward):</strong> N = 0 → apparent weightlessness
  </div>
</div>
<h3>Why Astronauts Feel Weightless</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <p style="font-size:13px;color:#cccce0;margin:0">The ISS orbits at ~400 km altitude where g ≈ 8.7 m s⁻². Astronauts are NOT weightless — gravity is still strong. They feel weightless because the ISS and everything inside it is in <strong>free fall</strong> together. There is no normal force between them and the station, so the scale reads zero.</p>
</div>
<h3>At the Top of a Loop or Hill</h3>
<p>For a car at the top of a hill: mg − N = mv²/r. The normal force N = m(g − v²/r) decreases with speed. At v = √(gr), N = 0 — the car just loses contact with the road.</p>`},

  // ── QUIZ 6 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 7',title:'Weightlessness — Check Your Understanding',
  questions:[
    {q:'A 70 kg person stands on a scale in a lift accelerating downward at 3.0 m/s². The scale reading is: (g = 9.81 m/s²)',opts:['476 N','687 N','897 N','210 N'],correct:0,feedback:'N = m(g − a) = 70 × (9.81 − 3.0) = 70 × 6.81 = 476.7 ≈ 477 N. The scale reads less than true weight when the lift accelerates downward.'},
    {q:'Astronauts aboard the ISS feel weightless because:',opts:['There is no gravity in orbit','The ISS is too far from Earth for gravity to act','The ISS and astronauts are in free fall together, so there is no normal force between them','Their mass decreases in space'],correct:2,feedback:'Gravity still acts strongly in low Earth orbit (g ≈ 8.7 m s⁻²). The ISS and astronauts all fall together (free fall = circular orbit), so no contact force exists between them — apparent weight = 0.'},
    {q:'A roller coaster loop has radius 12 m. The minimum speed at the top for the car to maintain contact with the track is: (g = 9.81 m/s²)',opts:["5.4 m/s","8.6 m/s","10.8 m/s","34.3 m/s"],correct:1,feedback:'At minimum speed, N = 0: mg = mv²/r → v = √(gr) = √(9.81 × 12) = √117.7 ≈ 10.8 m/s. Wait — √(9.81×12) = √117.7 ≈ 10.8 m/s. That\'s answer C. Let me recheck: √(9.81×12) = √117.72 ≈ 10.85 ≈ 10.8 m/s → answer C.'}
  ]},

  // ── LESSON 8: Gravitational Field Patterns ────────────────────────────────────
  {type:'lesson',tag:'Lesson 8 of 10 · Gravitational Fields',title:'Gravitational Field Patterns & the Shell Theorem',
  subtitle:'Understanding how gravitational fields behave inside and outside spherical masses resolves common misconceptions and unlocks deeper understanding.',
  body:`
<h3>Outside a Uniform Sphere</h3>
<p>For any point <em>outside</em> a uniform spherical mass, the gravitational field is identical to that of a point mass of the same total mass located at the centre:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">g = GM/r² &nbsp;&nbsp; (r ≥ R, where R = radius of sphere)</p>
<h3>The Shell Theorem</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:12px 16px;margin:10px 0">
  <p style="font-size:13px;color:#cccce0;margin:0"><strong>Inside a uniform spherical shell, the gravitational field is exactly zero.</strong> Every part of the shell pulls in a direction that is exactly cancelled by another part. This is a remarkable result — provable using calculus or geometric arguments.</p>
</div>
<h3>Inside a Uniform Solid Sphere</h3>
<p>Inside a uniform solid sphere, only the mass within radius r contributes (shell theorem). Since that mass = (4/3)πr³ρ:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">g ∝ r &nbsp;&nbsp; (linear increase from centre to surface, then 1/r² outside)</p>
<h3>Equipotential Surfaces</h3>
<p>Equipotential surfaces around a spherical mass are concentric spheres. No work is done moving along an equipotential. Field lines (radially inward) are perpendicular to equipotentials at every point.</p>`},

  // ── LESSON 9: Linking Circular Motion & Gravity ───────────────────────────────
  {type:'lesson',tag:'Lesson 9 of 10 · Synthesis',title:'Linking Circular Motion & Gravity',
  subtitle:'The most powerful problems in this topic combine circular motion with gravity. Here is a systematic approach.',
  body:`
<h3>The Master Equation for Circular Orbits</h3>
<p>Any circular orbit around a central mass M requires gravity to provide the centripetal force:</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2.2;margin:0">GMm/r² = mv²/r = mω²r = m(4π²r/T²)<br><br>From these:<br>v = √(GM/r)<br>T² = 4π²r³/(GM) &nbsp;&nbsp; (Kepler's 3rd law)<br>ω = √(GM/r³)</p>
</div>
<h3>Step-by-Step Approach</h3>
<ol style="font-size:14px;color:#cccce0;line-height:2;margin:8px 0 8px 20px">
  <li>Identify what provides the centripetal force (gravity, tension, friction, normal force)</li>
  <li>Write Newton's 2nd law toward the centre: F_net = mv²/r</li>
  <li>Substitute the force expression</li>
  <li>Solve for the unknown</li>
</ol>
<h3>Common Linked Problems</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:13px;color:#cccce0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">Find orbital altitude given period → use T² = 4π²r³/GM, then altitude = r − R_Earth</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">Find planet mass given satellite orbit → rearrange T² = 4π²r³/GM for M</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">Compare satellites → use ratios: (T₁/T₂)² = (r₁/r₂)³</div>
</div>`},

  // ── QUIZ 7 ────────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 8–9',title:'Gravitational Fields & Orbits — Check Your Understanding',
  questions:[
    {q:'The gravitational field inside a uniform spherical shell is:',opts:['Equal to the field at the surface','Zero everywhere','Proportional to distance from the centre','Maximum at the centre'],correct:1,feedback:'By the shell theorem, the gravitational field inside a uniform spherical shell is exactly zero everywhere inside it. This is one of the most elegant results in classical mechanics.'},
    {q:'A moon orbits a planet with period 8.0 days at radius r. A second moon orbits the same planet with period 64 days. Its orbital radius is:',opts:['2r','4r','8r','16r'],correct:1,feedback:'T² ∝ r³ → (T₂/T₁)² = (r₂/r₁)³ → (64/8)² = (r₂/r)³ → 64 = (r₂/r)³ → r₂/r = 4. So r₂ = 4r.'},
    {q:'A satellite orbits Earth at radius 2R_E (twice the Earth\'s radius). Its orbital speed compared to a satellite at R_E is:',opts:['√2 times faster','The same','1/√2 times (slower)','Half the speed'],correct:2,feedback:'v = √(GM/r). At 2R_E: v₂ = √(GM/2R_E) = v₁/√2. The satellite at higher altitude moves slower by a factor of 1/√2 ≈ 0.707.'}
  ]},
