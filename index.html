<script>
const TOPICS = [
  {id:1,title:"Measurements & Uncertainties",short:"Measurements",ahl:false,subtopics:["Measurement fundamentals","Uncertainties & errors","Vectors & scalars"],content:{
    "Measurement fundamentals":`
<h2>The SI System & Scientific Notation</h2>
<p>All physical quantities in IB Physics are expressed using the <strong>International System of Units (SI)</strong>. There are seven base units from which all other units are derived.</p>
<div class="key-box" role="note" aria-label="Key concept"><div class="kb-title">Seven SI Base Units</div>
<p>Length — metre (m) · Mass — kilogram (kg) · Time — second (s) · Electric current — ampere (A) · Temperature — kelvin (K) · Amount of substance — mole (mol) · Luminous intensity — candela (cd)</p></div>
<p>Scientific notation expresses any number as \\(a \\times 10^n\\) where \\(1 \\leq a < 10\\). This is essential for handling the enormous range of scales in physics — from the Planck length (\\(\\sim 10^{-35}\\) m) to the observable universe (\\(\\sim 10^{26}\\) m).</p>
<h3>SI Prefixes</h3>
<p>Memorise these prefixes: pico (p, \\(10^{-12}\\)), nano (n, \\(10^{-9}\\)), micro (μ, \\(10^{-6}\\)), milli (m, \\(10^{-3}\\)), kilo (k, \\(10^3\\)), mega (M, \\(10^6\\)), giga (G, \\(10^9\\)), tera (T, \\(10^{12}\\)).</p>
<h3>Orders of Magnitude</h3>
<p>Estimation to the nearest order of magnitude (power of 10) is a key IB skill. For example, the mass of an electron is \\(9.11 \\times 10^{-31}\\) kg, which is approximately \\(10^{-30}\\) kg to one order of magnitude.</p>`,
    "Uncertainties & errors":`
<h2>Uncertainties & Errors</h2>
<p>No measurement is perfect. Understanding error analysis is critical for Paper 1 and Paper 3 in IB Physics HL.</p>
<h3>Random vs Systematic Errors</h3>
<div class="key-box" role="note" aria-label="Key distinction"><div class="kb-title">Key Distinction</div>
<p><strong>Random errors</strong> cause scatter around the true value — they can be reduced by repeating measurements and averaging. <strong>Systematic errors</strong> shift all measurements in one direction — they cannot be reduced by repetition and often require recalibration.</p></div>
<h3>Absolute, Fractional & Percentage Uncertainty</h3>
<div class="equation-box" role="math" aria-label="Uncertainty forms"><div class="eq-label">Uncertainty Forms</div>
$$\\text{Absolute: } \\Delta x \\qquad \\text{Fractional: } \\frac{\\Delta x}{x} \\qquad \\text{Percentage: } \\frac{\\Delta x}{x} \\times 100\\%$$
</div>
<h3>Propagating Uncertainties</h3>
<div class="equation-box" role="math" aria-label="Rules for combining uncertainties"><div class="eq-label">Combining Uncertainties</div>
$$\\text{Addition/Subtraction: } \\Delta z = \\Delta a + \\Delta b$$
$$\\text{Multiplication/Division: } \\frac{\\Delta z}{z} = \\frac{\\Delta a}{a} + \\frac{\\Delta b}{b}$$
$$\\text{Power: } \\frac{\\Delta z}{z} = |n| \\frac{\\Delta a}{a} \\text{ where } z = a^n$$
</div>
<div class="warn-box" role="note" aria-label="Exam tip"><div class="wb-title">IB Exam Tip</div>
<p>In graph analysis, find uncertainty in gradient using the "max/min gradient" method — draw best-fit lines through the extreme points of error bars and compare the slopes.</p></div>`,
    "Vectors & scalars":`
<h2>Vectors & Scalars</h2>
<p>Physical quantities are classified as either scalars (magnitude only) or vectors (magnitude and direction).</p>
<div class="key-box" role="note" aria-label="Examples of vectors and scalars"><div class="kb-title">Examples</div>
<p><strong>Scalars:</strong> distance, speed, mass, energy, temperature, time, pressure<br><strong>Vectors:</strong> displacement, velocity, acceleration, force, momentum, electric field</p></div>
<h3>Vector Addition</h3>
<p>Vectors are added geometrically (tip-to-tail) or algebraically (component-wise).</p>
<div class="equation-box" role="math" aria-label="Component method for vector addition"><div class="eq-label">Component Method</div>
$$R_x = A\\cos\\theta_A + B\\cos\\theta_B \\qquad R_y = A\\sin\\theta_A + B\\sin\\theta_B$$
$$|\\mathbf{R}| = \\sqrt{R_x^2 + R_y^2}, \\quad \\theta_R = \\arctan\\left(\\frac{R_y}{R_x}\\right)$$
</div>`
  }},
  {id:2,title:"Mechanics",short:"Mechanics",ahl:false,subtopics:["Kinematics","Newton's Laws & Forces","Work, Energy & Power","Momentum & Impulse"],content:{
    "Kinematics":`
<h2>Kinematics</h2>
<p>Kinematics describes motion without considering its causes. Key quantities: displacement (\\(s\\)), velocity (\\(v\\)), acceleration (\\(a\\)), time (\\(t\\)).</p>
<h3>Equations of Motion (SUVAT)</h3>
<div class="equation-box" role="math" aria-label="Uniform acceleration equations"><div class="eq-label">Uniform Acceleration Equations</div>
$$v = u + at \\qquad s = ut + \\tfrac{1}{2}at^2$$
$$v^2 = u^2 + 2as \\qquad s = \\frac{(u+v)}{2}t$$
</div>
<div class="warn-box" role="note" aria-label="Sign convention reminder"><div class="wb-title">Sign Convention</div>
<p>Always define a positive direction first. Upward and rightward are typically positive. Gravitational acceleration \\(g = 9.81 \\text{ m s}^{-2}\\) acts downward, so \\(a = -9.81 \\text{ m s}^{-2}\\) when upward is positive.</p></div>
<h3>Projectile Motion</h3>
<div class="equation-box" role="math" aria-label="Projectile motion equations"><div class="eq-label">Projectile Equations (independent components)</div>
$$\\text{Horizontal: } x = u\\cos\\theta \\cdot t \\quad \\text{Vertical: } y = u\\sin\\theta \\cdot t - \\tfrac{1}{2}gt^2$$
</div>`,
    "Newton's Laws & Forces":`
<h2>Newton's Laws of Motion</h2>
<div class="key-box" role="note" aria-label="Newton's three laws"><div class="kb-title">Newton's Three Laws</div>
<p><strong>1st Law:</strong> A body remains at rest or moves at constant velocity unless a resultant force acts on it.<br>
<strong>2nd Law:</strong> Resultant force equals rate of change of momentum: \\(\\mathbf{F} = m\\mathbf{a}\\).<br>
<strong>3rd Law:</strong> Forces occur in equal and opposite pairs on different bodies.</p></div>
<h3>Friction</h3>
<div class="equation-box" role="math" aria-label="Friction force equations"><div class="eq-label">Friction Forces</div>
$$f \\leq \\mu_s N \\quad (\\text{static}) \\qquad f = \\mu_k N \\quad (\\text{kinetic})$$
</div>
<p>Static friction prevents motion; kinetic friction opposes it. Always \\(\\mu_s > \\mu_k\\).</p>`,
    "Work, Energy & Power":`
<h2>Work, Energy & Power</h2>
<div class="equation-box" role="math" aria-label="Core energy equations"><div class="eq-label">Core Definitions</div>
$$W = Fs\\cos\\theta \\qquad E_k = \\tfrac{1}{2}mv^2 \\qquad E_{grav} = mgh$$
$$P = \\frac{W}{t} = Fv \\qquad \\eta = \\frac{P_{out}}{P_{in}} \\times 100\\%$$
</div>
<div class="key-box" role="note" aria-label="Conservation of energy principle"><div class="kb-title">Conservation of Energy</div>
<p>Energy cannot be created or destroyed, only converted. In a closed system with no friction, total mechanical energy (KE + PE) is conserved. When friction acts: \\(E_{k,i} + E_{p,i} = E_{k,f} + E_{p,f} + W_{friction}\\).</p></div>`,
    "Momentum & Impulse":`
<h2>Momentum & Impulse</h2>
<div class="equation-box" role="math" aria-label="Momentum and impulse equations"><div class="eq-label">Definitions</div>
$$\\mathbf{p} = m\\mathbf{v} \\qquad \\mathbf{J} = \\mathbf{F}\\Delta t = \\Delta \\mathbf{p}$$
</div>
<div class="key-box" role="note" aria-label="Collision types"><div class="kb-title">Collision Types</div>
<p><strong>Elastic:</strong> momentum AND kinetic energy conserved.<br>
<strong>Inelastic:</strong> momentum conserved; KE not conserved.<br>
<strong>Perfectly inelastic:</strong> objects stick together — maximum KE loss.</p></div>
<div class="warn-box" role="note" aria-label="Important note on vector nature of momentum"><div class="wb-title">Vector Nature of Momentum</div>
<p>Momentum is a vector. In 2D collisions, apply conservation separately in x and y directions.</p></div>`
  }},
  {id:3,title:"Thermal Physics",short:"Thermal",ahl:false,subtopics:["Temperature & Heat","Ideal Gas Laws","Thermodynamics"],content:{
    "Temperature & Heat":`
<h2>Temperature, Heat & Internal Energy</h2>
<div class="key-box" role="note" aria-label="Key distinctions in thermal physics"><div class="kb-title">Key Distinctions</div>
<p><strong>Temperature:</strong> measure of average random kinetic energy of particles (K or °C).<br>
<strong>Internal energy:</strong> total kinetic + potential energy of all particles.<br>
<strong>Heat (Q):</strong> energy transferred due to a temperature difference.</p></div>
<div class="equation-box" role="math" aria-label="Thermal equations"><div class="eq-label">Thermal Equations</div>
$$Q = mc\\Delta T \\qquad Q = mL \\qquad T(K) = T(°C) + 273.15$$
</div>`,
    "Ideal Gas Laws":`
<h2>Ideal Gas Laws</h2>
<div class="equation-box" role="math" aria-label="Ideal gas law equations"><div class="eq-label">Gas Laws</div>
$$PV = nRT \\qquad P_1V_1/T_1 = P_2V_2/T_2 \\qquad PV = NkT$$
$$R = 8.31 \\text{ J mol}^{-1}\\text{K}^{-1} \\qquad k_B = 1.38 \\times 10^{-23} \\text{ J K}^{-1}$$
</div>
<h3>Kinetic Theory</h3>
<div class="equation-box" role="math" aria-label="Kinetic theory equations"><div class="eq-label">Average Kinetic Energy & RMS Speed</div>
$$\\langle E_k \\rangle = \\tfrac{3}{2}k_BT \\qquad v_{rms} = \\sqrt{\\frac{3RT}{M}}$$
</div>`,
    "Thermodynamics":`
<h2>Thermodynamics</h2>
<div class="equation-box" role="math" aria-label="First law of thermodynamics"><div class="eq-label">First Law of Thermodynamics</div>
$$\\Delta U = Q - W$$
</div>
<div class="warn-box" role="note" aria-label="Sign convention for thermodynamics"><div class="wb-title">Sign Convention (IB)</div>
<p>\\(Q > 0\\): heat flows INTO the system. \\(W > 0\\): work done BY the system (expansion).</p></div>
<div class="equation-box" role="math" aria-label="Carnot efficiency equation"><div class="eq-label">Carnot Efficiency</div>
$$\\eta_{Carnot} = 1 - \\frac{T_C}{T_H}$$
</div>`
  }},
  {id:4,title:"Waves",short:"Waves",ahl:false,subtopics:["Wave Characteristics","Wave Behaviour","Standing Waves"],content:{
    "Wave Characteristics":`
<h2>Wave Characteristics</h2>
<div class="equation-box" role="math" aria-label="Wave equation"><div class="eq-label">Wave Equation</div>
$$v = f\\lambda \\qquad T = \\frac{1}{f}$$
</div>
<div class="key-box" role="note" aria-label="Types of waves"><div class="kb-title">Transverse vs Longitudinal</div>
<p><strong>Transverse:</strong> oscillation perpendicular to energy propagation (light, water waves, S-waves).<br>
<strong>Longitudinal:</strong> oscillation parallel to propagation (sound, P-waves). Consist of compressions and rarefactions.</p></div>`,
    "Wave Behaviour":`
<h2>Wave Behaviour</h2>
<h3>Refraction — Snell's Law</h3>
<div class="equation-box" role="math" aria-label="Snell's law"><div class="eq-label">Snell's Law</div>
$$n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2 \\qquad n = \\frac{c}{v}$$
</div>
<div class="key-box" role="note" aria-label="Interference conditions"><div class="kb-title">Interference Conditions</div>
<p>Constructive: path difference = \\(n\\lambda\\). Destructive: path difference = \\((n+\\frac{1}{2})\\lambda\\). Sources must be coherent.</p></div>
<div class="equation-box" role="math" aria-label="Young's double slit experiment equation"><div class="eq-label">Young's Double-Slit Fringe Spacing</div>
$$\\Delta y = \\frac{\\lambda D}{d}$$
</div>`,
    "Standing Waves":`
<h2>Standing Waves</h2>
<p>Standing waves form when two identical waves travel in opposite directions and superpose. Energy is stored, not transported.</p>
<div class="equation-box" role="math" aria-label="Harmonic frequency equations"><div class="eq-label">Harmonic Frequencies</div>
$$\\text{String / Open pipe: } f_n = \\frac{nv}{2L} \\quad n = 1,2,3,...$$
$$\\text{Closed pipe: } f_n = \\frac{nv}{4L} \\quad n = 1,3,5,...$$
</div>`
  }},
  {id:5,title:"Electricity & Magnetism",short:"E & M",ahl:false,subtopics:["Electric Fields","Current & Circuits","Magnetic Forces","Electromagnetic Induction"],content:{
    "Electric Fields":`
<h2>Electric Fields & Coulomb's Law</h2>
<div class="equation-box" role="math" aria-label="Electric field and potential equations"><div class="eq-label">Core Equations</div>
$$F = \\frac{kq_1q_2}{r^2} \\quad k = 8.99 \\times 10^9 \\text{ N m}^2\\text{C}^{-2}$$
$$E = \\frac{kQ}{r^2} \\qquad V = \\frac{kQ}{r} \\qquad E = -\\frac{\\Delta V}{\\Delta r}$$
</div>
<div class="equation-box" role="math" aria-label="Parallel plate capacitor equations"><div class="eq-label">Parallel Plate Capacitor</div>
$$C = \\frac{\\varepsilon_0 A}{d} \\qquad Q = CV \\qquad U = \\frac{1}{2}CV^2$$
</div>`,
    "Current & Circuits":`
<h2>Current, Resistance & Circuits</h2>
<div class="equation-box" role="math" aria-label="Circuit fundamental equations"><div class="eq-label">Circuit Fundamentals</div>
$$I = \\frac{\\Delta Q}{\\Delta t} \\qquad V = IR \\qquad P = IV = I^2R = \\frac{V^2}{R}$$
</div>
<div class="key-box" role="note" aria-label="Kirchhoff's laws"><div class="kb-title">Kirchhoff's Laws</div>
<p><strong>KCL:</strong> \\(\\sum I_{in} = \\sum I_{out}\\) at any junction.<br>
<strong>KVL:</strong> \\(\\sum \\varepsilon = \\sum IR\\) around any closed loop.</p></div>
<div class="equation-box" role="math" aria-label="Resistor combinations"><div class="eq-label">Resistor Combinations</div>
$$\\text{Series: } R_T = R_1 + R_2 + ... \\qquad \\text{Parallel: } \\frac{1}{R_T} = \\frac{1}{R_1} + \\frac{1}{R_2} + ...$$
</div>`,
    "Magnetic Forces":`
<h2>Magnetic Fields & Forces</h2>
<div class="equation-box" role="math" aria-label="Magnetic force equations"><div class="eq-label">Magnetic Force Equations</div>
$$F = qvB\\sin\\theta \\qquad F = BIL\\sin\\theta$$
$$r = \\frac{mv}{qB} \\quad \\text{(cyclotron radius)}$$
</div>`,
    "Electromagnetic Induction":`
<h2>Electromagnetic Induction</h2>
<div class="key-box" role="note" aria-label="Faraday's and Lenz's laws"><div class="kb-title">Faraday's & Lenz's Laws</div>
<p><strong>Faraday:</strong> Induced EMF equals the rate of change of magnetic flux linkage: \\(\\varepsilon = -N\\frac{d\\Phi}{dt}\\)<br>
<strong>Lenz:</strong> Induced current opposes the change in flux (the negative sign).</p></div>
<div class="equation-box" role="math" aria-label="Transformer equation"><div class="eq-label">Ideal Transformer</div>
$$\\frac{V_s}{V_p} = \\frac{N_s}{N_p} = \\frac{I_p}{I_s}$$
</div>`
  }},
  {id:6,title:"Circular & Gravitational Motion",short:"Circular & Gravity",ahl:true,subtopics:["Circular Motion","Gravitational Fields"],content:{
    "Circular Motion":`
<h2>Circular Motion (AHL)</h2>
<div class="equation-box" role="math" aria-label="Circular motion equations"><div class="eq-label">Circular Motion Equations</div>
$$v = \\omega r \\qquad \\omega = \\frac{2\\pi}{T} = 2\\pi f$$
$$a_c = \\frac{v^2}{r} = \\omega^2 r \\qquad F_c = \\frac{mv^2}{r}$$
</div>
<div class="warn-box" role="note" aria-label="Common exam error warning"><div class="wb-title">Common Exam Error</div>
<p>Do NOT draw centripetal force as a separate arrow on a free body diagram. Identify which actual forces (or their components) provide centripetal acceleration.</p></div>`,
    "Gravitational Fields":`
<h2>Gravitational Fields (AHL)</h2>
<div class="equation-box" role="math" aria-label="Gravitational field equations"><div class="eq-label">Gravitational Equations</div>
$$F = \\frac{Gm_1m_2}{r^2} \\quad G = 6.67 \\times 10^{-11} \\text{ N m}^2\\text{kg}^{-2}$$
$$g = \\frac{GM}{r^2} \\qquad V_g = -\\frac{GM}{r}$$
$$T^2 = \\frac{4\\pi^2 r^3}{GM} \\quad \\text{(Kepler's Third Law)}$$
</div>
<div class="equation-box" role="math" aria-label="Escape speed equation"><div class="eq-label">Escape Speed</div>
$$v_{esc} = \\sqrt{\\frac{2GM}{R}}$$
</div>`
  }},
  {id:7,title:"Atomic & Nuclear Physics",short:"Atomic & Nuclear",ahl:false,subtopics:["Atomic Models","Radioactivity","Nuclear Reactions"],content:{
    "Atomic Models":`
<h2>Atomic Models & Quantum Ideas</h2>
<div class="equation-box" role="math" aria-label="Photoelectric effect equation"><div class="eq-label">Einstein's Photoelectric Equation</div>
$$hf = \\phi + E_{k,max} \\qquad h = 6.63 \\times 10^{-34} \\text{ J s}$$
</div>
<div class="equation-box" role="math" aria-label="Photon emission equation"><div class="eq-label">Photon Emission/Absorption</div>
$$hf = E_2 - E_1 \\qquad \\lambda = \\frac{hc}{E_2 - E_1}$$
</div>`,
    "Radioactivity":`
<h2>Radioactivity</h2>
<div class="key-box" role="note" aria-label="Types of nuclear radiation"><div class="kb-title">Three Types of Radiation</div>
<p><strong>Alpha (α):</strong> helium-4 nucleus; stopped by paper; highly ionising.<br>
<strong>Beta (β⁻):</strong> electron from neutron decay; stopped by aluminium.<br>
<strong>Gamma (γ):</strong> high-energy photon; stopped by thick lead; least ionising.</p></div>
<div class="equation-box" role="math" aria-label="Radioactive decay equations"><div class="eq-label">Radioactive Decay</div>
$$N = N_0 e^{-\\lambda t} \\qquad t_{1/2} = \\frac{\\ln 2}{\\lambda} \\qquad A = \\lambda N$$
</div>`,
    "Nuclear Reactions":`
<h2>Nuclear Reactions & Mass-Energy</h2>
<div class="equation-box" role="math" aria-label="Mass-energy equivalence and binding energy"><div class="eq-label">Mass-Energy & Binding Energy</div>
$$E = mc^2 \\qquad 1\\text{ u} = 931.5 \\text{ MeV/c}^2$$
$$E_B = \\Delta m \\cdot c^2 \\quad \\text{where } \\Delta m = [Zm_p + (A-Z)m_n] - m_{nucleus}$$
</div>`
  }},
  {id:8,title:"Energy Production",short:"Energy",ahl:false,subtopics:["Energy Sources","Thermal Power","Radiation & Climate"],content:{
    "Energy Sources":`
<h2>Energy Sources</h2>
<div class="key-box" role="note" aria-label="Renewable versus non-renewable energy"><div class="kb-title">Renewable vs Non-renewable</div>
<p><strong>Fossil fuels (non-renewable):</strong> coal, oil, gas — high energy density, reliable, but CO₂ emissions.<br>
<strong>Nuclear fission:</strong> very high energy density, no CO₂, but radioactive waste.<br>
<strong>Renewables:</strong> solar, wind, hydro, tidal — low emissions but variable output.</p></div>`,
    "Thermal Power":`
<h2>Thermal Power Stations</h2>
<div class="equation-box" role="math" aria-label="Thermal efficiency equation"><div class="eq-label">Thermal Efficiency</div>
$$\\eta = \\frac{P_{electrical}}{P_{thermal}} \\leq \\eta_{Carnot} = 1 - \\frac{T_C}{T_H}$$
</div>
<div class="equation-box" role="math" aria-label="Solar power intensity equation"><div class="eq-label">Solar Intensity</div>
$$P_{incident} = I \\cdot A \\cdot \\cos\\theta \\qquad \\text{Solar constant} \\approx 1360 \\text{ W m}^{-2}$$
</div>`,
    "Radiation & Climate":`
<h2>Radiation, Greenhouse Effect & Climate</h2>
<div class="equation-box" role="math" aria-label="Stefan-Boltzmann law and Wien's displacement law"><div class="eq-label">Stefan-Boltzmann & Wien's Law</div>
$$P = \\sigma A T^4 \\qquad \\sigma = 5.67 \\times 10^{-8} \\text{ W m}^{-2}\\text{K}^{-4}$$
$$\\lambda_{max} T = 2.90 \\times 10^{-3} \\text{ m K}$$
</div>`
  }},
  {id:9,title:"Wave Phenomena (AHL)",short:"Wave Phenomena",ahl:true,subtopics:["Doppler Effect","Single Slit Diffraction","Resolution & Polarisation"],content:{
    "Doppler Effect":`
<h2>Doppler Effect (AHL)</h2>
<div class="equation-box" role="math" aria-label="Doppler effect equation"><div class="eq-label">Doppler Equation</div>
$$f_{obs} = f_s\\left(\\frac{v \\pm v_o}{v \\mp v_s}\\right) \\qquad z = \\frac{\\Delta\\lambda}{\\lambda} \\approx \\frac{v}{c}$$
</div>
<p>Upper signs when source/observer approach; lower when receding. Observed frequency increases as source approaches.</p>`,
    "Single Slit Diffraction":`
<h2>Single Slit Diffraction (AHL)</h2>
<div class="equation-box" role="math" aria-label="Single slit diffraction minima equation"><div class="eq-label">Single Slit Minima</div>
$$b\\sin\\theta = m\\lambda \\quad m = \\pm 1, \\pm 2, ...$$
</div>
<p>Narrower slit produces wider central maximum. The single-slit envelope modulates the double-slit interference pattern.</p>`,
    "Resolution & Polarisation":`
<h2>Resolution & Polarisation (AHL)</h2>
<div class="equation-box" role="math" aria-label="Rayleigh criterion and Malus's law"><div class="eq-label">Rayleigh Criterion & Malus's Law</div>
$$\\theta_{min} = 1.22 \\frac{\\lambda}{D} \\qquad I = I_0 \\cos^2\\theta$$
</div>`
  }},
  {id:10,title:"Fields & Relativity (AHL)",short:"Fields & Relativity",ahl:true,subtopics:["Electric Potential","Special Relativity"],content:{
    "Electric Potential":`
<h2>Electric Potential & Field (AHL)</h2>
<div class="equation-box" role="math" aria-label="Electric field and potential equations"><div class="eq-label">Electric Field & Potential</div>
$$V = \\frac{kQ}{r} \\qquad \\mathbf{E} = -\\frac{dV}{dr} \\qquad W = q\\Delta V$$
$$C = \\frac{\\kappa \\varepsilon_0 A}{d} \\quad \\text{(with dielectric constant } \\kappa\\text{)}$$
</div>`,
    "Special Relativity":`
<h2>Special Relativity (AHL)</h2>
<div class="key-box" role="note" aria-label="Einstein's two postulates"><div class="kb-title">Einstein's Two Postulates (1905)</div>
<p>1. The laws of physics are identical in all inertial frames.<br>
2. The speed of light in a vacuum \\(c\\) is the same for all observers in all inertial frames.</p></div>
<div class="equation-box" role="math" aria-label="Lorentz factor and relativistic effects"><div class="eq-label">Lorentz Factor & Relativistic Effects</div>
$$\\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}} \\qquad \\Delta t' = \\gamma \\Delta t_0 \\qquad L' = \\frac{L_0}{\\gamma}$$
$$p = \\gamma mv \\qquad E = \\gamma mc^2 \\qquad E^2 = (pc)^2 + (mc^2)^2$$
</div>`
  }}
];

const TOPIC_QUESTIONS = {
  1: [
    {question:"Which of the following is an SI base unit?",context:"",options:["A) Newton","B) Joule","C) Kelvin","D) Pascal"],correct:2,explanation:"The kelvin (K) is one of the seven SI base units. Newton, joule and pascal are all derived units."},
    {question:"A measurement is recorded as 4.52 ± 0.03 cm. What is the percentage uncertainty?",context:"",options:["A) 0.03%","B) 0.66%","C) 6.6%","D) 3.0%"],correct:1,explanation:"Percentage uncertainty = (0.03/4.52) × 100% ≈ 0.66%."},
    {question:"A student measures a wire diameter five times; the values cluster tightly but are all above the true value. This indicates:",context:"",options:["A) High accuracy, high precision","B) Low accuracy, high precision","C) High accuracy, low precision","D) Low accuracy, low precision"],correct:1,explanation:"Consistent results mean high precision, but all being above the true value indicates a systematic error — low accuracy."},
    {question:"When multiplying A = 5.0 ± 0.2 by B = 3.0 ± 0.1, what is the percentage uncertainty in A × B?",context:"",options:["A) 4.0%","B) 3.3%","C) 7.3%","D) 0.3%"],correct:2,explanation:"%Δ(AB) = %ΔA + %ΔB = (0.2/5.0 + 0.1/3.0) × 100 = 4.0% + 3.3% = 7.3%."},
    {question:"Which prefix represents 10⁻⁹?",context:"",options:["A) Micro","B) Pico","C) Nano","D) Femto"],correct:2,explanation:"Nano (n) = 10⁻⁹. Micro = 10⁻⁶, pico = 10⁻¹², femto = 10⁻¹⁵."},
    {question:"A vector quantity has:",context:"",options:["A) Magnitude only","B) Direction only","C) Both magnitude and direction","D) Neither magnitude nor direction"],correct:2,explanation:"Vectors have both magnitude and direction. Scalars have magnitude only."},
    {question:"Which of the following is a scalar quantity?",context:"",options:["A) Velocity","B) Displacement","C) Electric field","D) Temperature"],correct:3,explanation:"Temperature has magnitude only — it is a scalar. Velocity, displacement and electric field are all vectors."},
    {question:"Two vectors of magnitude 5 N and 12 N act at right angles to each other. The resultant magnitude is:",context:"",options:["A) 7 N","B) 13 N","C) 17 N","D) 60 N"],correct:1,explanation:"Resultant = √(5² + 12²) = √169 = 13 N by Pythagoras."},
    {question:"A force of 20 N acts at 30° to the horizontal. Its horizontal component is:",context:"",options:["A) 10.0 N","B) 17.3 N","C) 20.0 N","D) 34.6 N"],correct:1,explanation:"Horizontal component = 20 cos 30° = 20 × (√3/2) ≈ 17.3 N."},
    {question:"The uncertainty in a single reading from a ruler with 1 mm graduations is best quoted as:",context:"",options:["A) ± 0.1 mm","B) ± 0.5 mm","C) ± 1 mm","D) ± 2 mm"],correct:1,explanation:"For an analogue scale the uncertainty is half the smallest division: ½ × 1 mm = ± 0.5 mm."},
    {question:"Which best describes a systematic error?",context:"",options:["A) It causes random scatter in data","B) It shifts all readings consistently in one direction","C) It is reduced by averaging many measurements","D) It always results from human reaction time"],correct:1,explanation:"Systematic errors cause a consistent bias in one direction and cannot be eliminated by averaging."},
    {question:"If z = x³ and the percentage uncertainty in x is 4%, the percentage uncertainty in z is:",context:"",options:["A) 4%","B) 8%","C) 12%","D) 64%"],correct:2,explanation:"For z = xⁿ, the rule is %Δz = n × %Δx = 3 × 4% = 12%."},
    {question:"A micrometer consistently reads 0.05 mm higher than the true value. This is best described as:",context:"",options:["A) A random error","B) A zero error","C) A parallax error","D) A reading error"],correct:1,explanation:"A consistent offset from the true value is a zero error — a type of systematic error."},
    {question:"Which combination of SI base units is equivalent to the pascal (Pa)?",context:"",options:["A) kg m⁻¹ s⁻²","B) kg m s⁻²","C) kg m⁻² s⁻¹","D) kg m² s⁻²"],correct:0,explanation:"Pa = N m⁻² = (kg m s⁻²) m⁻² = kg m⁻¹ s⁻²."},
    {question:"The gradient of a displacement–time graph gives:",context:"",options:["A) Acceleration","B) Velocity","C) Distance","D) Force"],correct:1,explanation:"The gradient of a displacement–time graph is Δs/Δt, which is velocity."},
    {question:"Quantities are added together: P = 12.4 ± 0.3 cm and Q = 7.1 ± 0.2 cm. The absolute uncertainty in P + Q is:",context:"",options:["A) ± 0.1 cm","B) ± 0.25 cm","C) ± 0.5 cm","D) ± 0.6 cm"],correct:2,explanation:"When adding quantities, absolute uncertainties add: ΔP + ΔQ = 0.3 + 0.2 = 0.5 cm."},
    {question:"Which of the following is a derived SI unit?",context:"",options:["A) Kilogram","B) Ampere","C) Joule","D) Mole"],correct:2,explanation:"The joule (J = kg m² s⁻²) is derived. Kilogram, ampere and mole are base units."},
    {question:"A force vector F has components Fx = 6 N and Fy = 8 N. The magnitude of F is:",context:"",options:["A) 7 N","B) 10 N","C) 14 N","D) 48 N"],correct:1,explanation:"|F| = √(6² + 8²) = √(36 + 64) = √100 = 10 N."},
    {question:"The speed of light (≈ 3 × 10⁸ m/s) to the nearest order of magnitude is:",context:"",options:["A) 10⁷ m/s","B) 10⁸ m/s","C) 10⁹ m/s","D) 10¹⁰ m/s"],correct:1,explanation:"3 × 10⁸ rounds to 10⁸ because 3 < √10 ≈ 3.16, so the exponent stays at 8."},
    {question:"Which statement about random errors is correct?",context:"",options:["A) They can be eliminated by calibrating the instrument","B) They cause all readings to be too high","C) They are reduced by taking more measurements and averaging","D) They are always larger than systematic errors"],correct:2,explanation:"Random errors cause scatter; averaging many measurements reduces their effect. They cannot be eliminated by calibration."},
    {question:"A quantity T = 2π√(L/g). If L has a 2% uncertainty and g has a 4% uncertainty, the percentage uncertainty in T is:",context:"",options:["A) 3%","B) 6%","C) 1%","D) 3.0%"],correct:0,explanation:"T ∝ L^½ / g^½, so %ΔT = ½(%ΔL) + ½(%Δg) = ½(2%) + ½(4%) = 1% + 2% = 3%."},
    {question:"When subtracting Q = 3.2 ± 0.1 from P = 8.7 ± 0.2, the result and its absolute uncertainty are:",context:"",options:["A) 5.5 ± 0.1","B) 5.5 ± 0.2","C) 5.5 ± 0.3","D) 5.5 ± 0.02"],correct:2,explanation:"Absolute uncertainties always add for both addition and subtraction: 0.2 + 0.1 = 0.3."},
    {question:"A student draws a best-fit line through data points with error bars. The maximum and minimum gradients give values of 4.8 and 3.6. The gradient and its uncertainty are:",context:"",options:["A) 4.2 ± 0.6","B) 4.2 ± 1.2","C) 4.4 ± 0.6","D) 4.4 ± 0.4"],correct:0,explanation:"Best estimate = (4.8 + 3.6)/2 = 4.2; uncertainty = (4.8 − 3.6)/2 = 0.6. So gradient = 4.2 ± 0.6."},
    {question:"Which unit is equivalent to the watt?",context:"",options:["A) J s","B) kg m² s⁻²","C) kg m² s⁻³","D) N m s"],correct:2,explanation:"Watt = J/s = (kg m² s⁻²)/s = kg m² s⁻³."},
    {question:"A vector of magnitude 15 N acts at 60° above the horizontal. Its vertical component is:",context:"",options:["A) 7.5 N","B) 12.99 N","C) 15 N","D) 30 N"],correct:1,explanation:"Vertical component = 15 sin 60° = 15 × (√3/2) ≈ 12.99 N."},
    {question:"The radius of a hydrogen atom is approximately 5 × 10⁻¹¹ m. In nanometres this is:",context:"",options:["A) 5 × 10⁻² nm","B) 0.05 nm","C) 5 nm","D) 50 nm"],correct:1,explanation:"1 nm = 10⁻⁹ m, so 5 × 10⁻¹¹ m = 5 × 10⁻¹¹/10⁻⁹ nm = 0.05 nm."},
    {question:"If a graph of y against x² is a straight line through the origin, which relationship does this confirm?",context:"",options:["A) y ∝ x","B) y ∝ x²","C) y ∝ 1/x","D) y ∝ √x"],correct:1,explanation:"A straight line through the origin on a y vs x² graph means y = kx², confirming y ∝ x²."},
    {question:"Which of the following correctly states the SI unit of momentum?",context:"",options:["A) kg m s⁻²","B) N s⁻¹","C) kg m s⁻¹","D) J m⁻¹"],correct:2,explanation:"Momentum p = mv has units kg × m s⁻¹ = kg m s⁻¹. Note that N s is also correct and equivalent, but kg m s⁻¹ is the base-unit form."},
    {question:"A student plots current (I) against voltage (V) for a resistor. The graph has a constant gradient. What does this indicate?",context:"",options:["A) The resistance changes with voltage","B) The resistance is constant — the resistor is ohmic","C) Power is constant","D) The resistor is non-ohmic"],correct:1,explanation:"A straight-line I–V graph with constant gradient means R = V/I is constant — characteristic of an ohmic conductor."},
    {question:"Two forces act on an object: 8 N north and 6 N east. The direction of the resultant measured from north is:",context:"",options:["A) 36.9° east of north","B) 53.1° east of north","C) 30° east of north","D) 45° east of north"],correct:0,explanation:"θ = arctan(6/8) = arctan(0.75) ≈ 36.9° east of north."}
  ],
  2: [
    {question:"A car accelerates uniformly from rest and travels 80 m in 4.0 s. What is its acceleration?",context:"",options:["A) 5.0 m s⁻²","B) 10 m s⁻²","C) 20 m s⁻²","D) 40 m s⁻²"],correct:1,explanation:"Using s = ½at²: 80 = ½ × a × 16, so a = 160/16 = 10 m s⁻²."},
    {question:"Which equation of motion correctly relates final velocity v to initial velocity u, acceleration a and displacement s?",context:"",options:["A) v = u + as","B) v² = u² + 2as","C) v = u + 2at","D) v² = u + 2as"],correct:1,explanation:"v² = u² + 2as is the correct SUVAT equation linking v, u, a and s without time."},
    {question:"A ball is thrown horizontally at 15 m s⁻¹ from a cliff. Ignoring air resistance, what is the horizontal distance travelled after 3.0 s?",context:"",options:["A) 5 m","B) 15 m","C) 45 m","D) 135 m"],correct:2,explanation:"Horizontal motion is uniform: x = uₓt = 15 × 3.0 = 45 m."},
    {question:"Newton's first law states that a body will remain at rest or move with constant velocity unless:",context:"",options:["A) It has mass","B) A resultant force acts on it","C) It is in a vacuum","D) Its momentum is zero"],correct:1,explanation:"Newton's first law: an object continues in its state of rest or uniform motion unless acted on by a net (resultant) external force."},
    {question:"A 4.0 kg object accelerates at 3.0 m s⁻² to the right. The net force on it is:",context:"",options:["A) 1.3 N right","B) 12 N right","C) 12 N left","D) 7.0 N right"],correct:1,explanation:"F = ma = 4.0 × 3.0 = 12 N in the direction of acceleration (right)."},
    {question:"Which of the following is an example of Newton's third law?",context:"",options:["A) A skydiver reaches terminal velocity","B) A rocket expels gas backwards and accelerates forwards","C) A car brakes and decelerates","D) A pendulum swings back and forth"],correct:1,explanation:"Newton's 3rd law: the rocket exerts a force on gas (backwards) and the gas exerts an equal and opposite force on the rocket (forwards). The pair acts on different objects."},
    {question:"A 2.0 kg block is pushed across a surface with a coefficient of kinetic friction μk = 0.30. The frictional force is: (g = 9.81 m s⁻²)",context:"",options:["A) 0.60 N","B) 5.9 N","C) 6.5 N","D) 19.6 N"],correct:1,explanation:"f = μk × N = μk × mg = 0.30 × 2.0 × 9.81 ≈ 5.9 N."},
    {question:"The work done by a force of 25 N acting at 60° to the direction of displacement of 8.0 m is:",context:"",options:["A) 200 J","B) 173 J","C) 100 J","D) 50 J"],correct:2,explanation:"W = Fs cosθ = 25 × 8.0 × cos60° = 200 × 0.5 = 100 J."},
    {question:"A 5.0 kg object is lifted 3.0 m vertically. The gain in gravitational potential energy is: (g = 9.81 m s⁻²)",context:"",options:["A) 15 J","B) 49 J","C) 147 J","D) 245 J"],correct:2,explanation:"ΔEp = mgh = 5.0 × 9.81 × 3.0 ≈ 147 J."},
    {question:"A 1200 kg car travelling at 20 m s⁻¹ has kinetic energy of:",context:"",options:["A) 12 000 J","B) 24 000 J","C) 240 000 J","D) 480 000 J"],correct:2,explanation:"Ek = ½mv² = ½ × 1200 × 400 = 240 000 J."},
    {question:"The work–energy theorem states that:",context:"",options:["A) Work equals the change in potential energy","B) Net work done equals the change in kinetic energy","C) Work equals force times time","D) Net work done equals the total energy"],correct:1,explanation:"The work–energy theorem: Wnet = ΔEk. The net work done on an object equals its change in kinetic energy."},
    {question:"An engine delivers 6000 W of power and moves a vehicle at a constant speed of 30 m s⁻¹. The driving force is:",context:"",options:["A) 20 N","B) 200 N","C) 180 000 N","D) 2000 N"],correct:1,explanation:"P = Fv → F = P/v = 6000/30 = 200 N."},
    {question:"A machine lifts a 50 kg load through 4.0 m in 10 s. Its useful output power is: (g = 9.81 m s⁻²)",context:"",options:["A) 20 W","B) 196 W","C) 1960 W","D) 49 W"],correct:1,explanation:"P = W/t = mgh/t = (50 × 9.81 × 4.0)/10 ≈ 196 W."},
    {question:"Linear momentum is defined as:",context:"",options:["A) Mass × acceleration","B) Force × time","C) Mass × velocity","D) Kinetic energy × 2"],correct:2,explanation:"Linear momentum p = mv (mass × velocity). It is a vector quantity with units kg m s⁻¹."},
    {question:"A 0.50 kg ball moving at 6.0 m s⁻¹ strikes a wall and rebounds at 4.0 m s⁻¹. The magnitude of the impulse is:",context:"",options:["A) 1.0 N s","B) 3.0 N s","C) 5.0 N s","D) 10 N s"],correct:2,explanation:"Taking initial direction as positive: Δp = m(v − u) = 0.50 × (−4.0 − 6.0) = −5.0 N s. Magnitude = 5.0 N s."},
    {question:"In a perfectly inelastic collision between two objects:",context:"",options:["A) Both kinetic energy and momentum are conserved","B) Neither kinetic energy nor momentum is conserved","C) Momentum is conserved but kinetic energy is not","D) Kinetic energy is conserved but momentum is not"],correct:2,explanation:"In all collisions momentum is conserved (no external forces). In a perfectly inelastic collision the objects stick together and kinetic energy is lost to internal energy."},
    {question:"A projectile is launched at 30° above the horizontal at 20 m s⁻¹. Its initial vertical component of velocity is:",context:"",options:["A) 10 m s⁻¹","B) 17.3 m s⁻¹","C) 20 m s⁻¹","D) 34.6 m s⁻¹"],correct:0,explanation:"vy = v sinθ = 20 × sin30° = 20 × 0.5 = 10 m s⁻¹."},
    {question:"At the highest point of a projectile's trajectory (no air resistance):",context:"",options:["A) Both horizontal and vertical velocity are zero","B) Only horizontal velocity is zero","C) Only vertical velocity is zero","D) The acceleration is zero"],correct:2,explanation:"At maximum height the vertical component of velocity is zero, but the horizontal component remains constant. Acceleration is still g downward."},
    {question:"A 3.0 kg trolley moving at 4.0 m s⁻¹ collides and joins with a stationary 1.0 kg trolley. Their combined speed after collision is:",context:"",options:["A) 1.0 m s⁻¹","B) 3.0 m s⁻¹","C) 4.0 m s⁻¹","D) 12 m s⁻¹"],correct:1,explanation:"Conservation of momentum: (3.0)(4.0) = (3.0 + 1.0)v → v = 12/4 = 3.0 m s⁻¹."},
    {question:"A car of mass 800 kg decelerates uniformly from 30 m s⁻¹ to rest over 60 m. The braking force is:",context:"",options:["A) 400 N","B) 3000 N","C) 6000 N","D) 12 000 N"],correct:2,explanation:"v² = u² + 2as → 0 = 900 + 2a(60) → a = −7.5 m s⁻². F = ma = 800 × 7.5 = 6000 N."},
    {question:"Which graph shows uniform acceleration from rest?",context:"",options:["A) A straight horizontal line on a v–t graph","B) A straight line through the origin on a v–t graph","C) A curved line on an s–t graph that levels off","D) A straight horizontal line on an s–t graph"],correct:1,explanation:"Uniform acceleration from rest gives v = at, which is a straight line through the origin on a velocity–time graph."},
    {question:"The area under a force–time graph represents:",context:"",options:["A) Power","B) Work","C) Impulse","D) Momentum"],correct:2,explanation:"Area under F–t graph = F × Δt = impulse = change in momentum (N s)."},
    {question:"A force of 10 N is applied to a 2.0 kg block on a frictionless surface. Its acceleration is:",context:"",options:["A) 0.2 m s⁻²","B) 5.0 m s⁻²","C) 20 m s⁻²","D) 12 m s⁻²"],correct:1,explanation:"a = F/m = 10/2.0 = 5.0 m s⁻². No friction, so net force equals applied force."},
    {question:"A stone is dropped from a bridge and takes 2.5 s to hit the water. The height of the bridge is: (g = 9.81 m s⁻²)",context:"",options:["A) 12.3 m","B) 24.5 m","C) 30.7 m","D) 61.3 m"],correct:2,explanation:"s = ½gt² = ½ × 9.81 × 6.25 ≈ 30.7 m."},
    {question:"A machine has an input power of 500 W and an efficiency of 60%. Its useful output power is:",context:"",options:["A) 60 W","B) 200 W","C) 300 W","D) 833 W"],correct:2,explanation:"Useful output = efficiency × input = 0.60 × 500 = 300 W."},
    {question:"Which of the following correctly describes the coefficient of static friction?",context:"",options:["A) It equals kinetic friction divided by the normal force","B) It is always less than the coefficient of kinetic friction","C) It is the maximum ratio of friction force to normal force before motion begins","D) It depends on the speed of the object"],correct:2,explanation:"The coefficient of static friction μs = (maximum static friction) / N. It is always greater than the kinetic coefficient and does not depend on speed."},
    {question:"Two objects undergo an elastic collision. Which quantities are conserved?",context:"",options:["A) Momentum only","B) Kinetic energy only","C) Both momentum and kinetic energy","D) Neither momentum nor kinetic energy"],correct:2,explanation:"In an elastic collision both total momentum and total kinetic energy are conserved. This is the defining feature of elastic collisions."},
    {question:"A ball of mass 0.20 kg is moving at 5.0 m s⁻¹. A force acts on it for 0.40 s and brings it to rest. The average force is:",context:"",options:["A) 0.50 N","B) 1.0 N","C) 2.5 N","D) 4.0 N"],correct:2,explanation:"Impulse = Δp → FΔt = mΔv → F = mΔv/Δt = 0.20 × 5.0 / 0.40 = 2.5 N."},
    {question:"A 60 kg person stands on a scale in a lift (elevator) accelerating upward at 2.0 m s⁻². The scale reads: (g = 9.81 m s⁻²)",context:"",options:["A) 468 N","B) 589 N","C) 708 N","D) 120 N"],correct:2,explanation:"N = m(g + a) = 60 × (9.81 + 2.0) = 60 × 11.81 ≈ 708 N."},
    {question:"An object is thrown vertically upward with a speed of 15 m s⁻¹. The maximum height reached is: (g = 9.81 m s⁻²)",context:"",options:["A) 7.5 m","B) 11.5 m","C) 15.0 m","D) 22.5 m"],correct:1,explanation:"v² = u² − 2gh → 0 = 225 − 2(9.81)h → h = 225/19.62 ≈ 11.5 m."}
  ],
  3: [
    {question:"What is 25 °C expressed in kelvin?",context:"",options:["A) 248 K","B) 298 K","C) 308 K","D) 273 K"],correct:1,explanation:"T(K) = T(°C) + 273.15 = 25 + 273.15 ≈ 298 K."},
    {question:"Which statement correctly distinguishes heat from temperature?",context:"",options:["A) Heat is a property of an object; temperature is energy transferred","B) Temperature measures the total internal energy; heat is the average kinetic energy","C) Heat is energy transferred due to a temperature difference; temperature measures average random kinetic energy of particles","D) Heat and temperature are the same quantity measured in different units"],correct:2,explanation:"Heat (Q) is energy transferred between objects due to a temperature difference. Temperature is a measure of the average random kinetic energy of particles."},
    {question:"4200 J of heat raises the temperature of 1.0 kg of water by 1.0 °C. This value is the:",context:"",options:["A) Specific latent heat","B) Specific heat capacity","C) Thermal conductivity","D) Molar heat capacity"],correct:1,explanation:"Specific heat capacity c = Q/(mΔT). For water, c ≈ 4200 J kg⁻¹ K⁻¹."},
    {question:"How much energy is needed to raise 2.0 kg of iron by 50 °C? (c_iron = 450 J kg⁻¹ K⁻¹)",context:"",options:["A) 4500 J","B) 9000 J","C) 22500 J","D) 45000 J"],correct:3,explanation:"Q = mcΔT = 2.0 × 450 × 50 = 45 000 J."},
    {question:"During a change of state (e.g. melting), the temperature of a substance:",context:"",options:["A) Increases steadily","B) Decreases steadily","C) Remains constant","D) Changes unpredictably"],correct:2,explanation:"During a phase change, energy input goes into breaking intermolecular bonds rather than increasing kinetic energy, so temperature stays constant."},
    {question:"The specific latent heat of vaporisation of water is 2.26 × 10⁶ J kg⁻¹. How much energy is needed to vaporise 0.50 kg of water at 100 °C?",context:"",options:["A) 1.13 × 10³ J","B) 1.13 × 10⁶ J","C) 4.52 × 10⁶ J","D) 2.26 × 10⁶ J"],correct:1,explanation:"Q = mL = 0.50 × 2.26 × 10⁶ = 1.13 × 10⁶ J."},
    {question:"Which of the following is an assumption of the ideal gas model?",context:"",options:["A) Molecules occupy a significant fraction of the container volume","B) Intermolecular forces are strong between molecules","C) All collisions between molecules are perfectly elastic","D) Molecules move in fixed circular paths"],correct:2,explanation:"The ideal gas model assumes: negligible molecular volume, no intermolecular forces, and perfectly elastic collisions."},
    {question:"A gas at 300 K is heated at constant pressure until its volume doubles. The new temperature is:",context:"",options:["A) 150 K","B) 300 K","C) 450 K","D) 600 K"],correct:3,explanation:"At constant pressure (Charles's law): V/T = constant → V₁/T₁ = V₂/T₂ → T₂ = T₁ × (V₂/V₁) = 300 × 2 = 600 K."},
    {question:"A fixed mass of gas has pressure 2.0 × 10⁵ Pa and volume 3.0 L. If the volume is reduced to 1.5 L at constant temperature, the new pressure is:",context:"",options:["A) 1.0 × 10⁵ Pa","B) 2.0 × 10⁵ Pa","C) 4.0 × 10⁵ Pa","D) 6.0 × 10⁵ Pa"],correct:2,explanation:"Boyle's law (constant T): P₁V₁ = P₂V₂ → P₂ = (2.0 × 10⁵ × 3.0)/1.5 = 4.0 × 10⁵ Pa."},
    {question:"The ideal gas equation is PV = nRT. What does n represent?",context:"",options:["A) Number of molecules","B) Number of moles","C) Molar mass","D) Avogadro's number"],correct:1,explanation:"n is the number of moles of gas. R = 8.31 J mol⁻¹ K⁻¹ is the universal gas constant."},
    {question:"According to kinetic theory, the average kinetic energy of a molecule in an ideal gas is proportional to:",context:"",options:["A) Pressure only","B) Volume only","C) Absolute temperature","D) The square root of temperature"],correct:2,explanation:"⟨Ek⟩ = (3/2)k_BT. Average molecular kinetic energy is directly proportional to absolute temperature T."},
    {question:"The rms speed of molecules in a gas is doubled. By what factor does the absolute temperature change?",context:"",options:["A) 2","B) 4","C) √2","D) 8"],correct:1,explanation:"v_rms ∝ √T, so if v doubles then T increases by a factor of 2² = 4."},
    {question:"Which process occurs at constant volume?",context:"",options:["A) Isothermal","B) Isobaric","C) Adiabatic","D) Isochoric"],correct:3,explanation:"Isochoric means constant volume (ΔV = 0, so W = 0). Isothermal = constant T; isobaric = constant P; adiabatic = no heat exchange."},
    {question:"The first law of thermodynamics states that ΔU = Q − W. For an adiabatic process:",context:"",options:["A) ΔU = 0","B) Q = 0, so ΔU = −W","C) W = 0, so ΔU = Q","D) Q = W"],correct:1,explanation:"In an adiabatic process no heat is exchanged (Q = 0), so ΔU = −W. The internal energy changes only due to work done."},
    {question:"A gas expands at constant pressure of 1.5 × 10⁵ Pa, increasing in volume by 2.0 × 10⁻³ m³. The work done by the gas is:",context:"",options:["A) 75 J","B) 300 J","C) 750 J","D) 3000 J"],correct:1,explanation:"W = PΔV = 1.5 × 10⁵ × 2.0 × 10⁻³ = 300 J."},
    {question:"In an isothermal expansion of an ideal gas:",context:"",options:["A) Internal energy increases","B) Temperature falls","C) Heat must be absorbed from the surroundings","D) No work is done"],correct:2,explanation:"Isothermal: ΔT = 0, so ΔU = 0. From ΔU = Q − W: Q = W. The gas does positive work, so heat must be absorbed."},
    {question:"A Carnot engine operates between 600 K and 300 K. Its maximum efficiency is:",context:"",options:["A) 25%","B) 50%","C) 75%","D) 100%"],correct:1,explanation:"η_Carnot = 1 − T_C/T_H = 1 − 300/600 = 0.50 = 50%."},
    {question:"The internal energy of an ideal monatomic gas depends only on:",context:"",options:["A) Pressure","B) Volume","C) Temperature","D) Both pressure and volume"],correct:2,explanation:"For an ideal gas there are no intermolecular forces, so internal energy is purely kinetic and depends only on temperature."},
    {question:"1.0 mol of gas at 300 K occupies a volume of 0.025 m³. Its pressure is: (R = 8.31 J mol⁻¹ K⁻¹)",context:"",options:["A) 9.97 × 10⁴ Pa","B) 9.97 × 10³ Pa","C) 2.49 × 10⁵ Pa","D) 1.00 × 10⁵ Pa"],correct:0,explanation:"P = nRT/V = (1.0 × 8.31 × 300)/0.025 = 2493/0.025 ≈ 9.97 × 10⁴ Pa."},
    {question:"Which temperature scale has its zero point at absolute zero?",context:"",options:["A) Celsius","B) Fahrenheit","C) Kelvin","D) Rankine"],correct:2,explanation:"The Kelvin scale starts at absolute zero (0 K = −273.15 °C), the temperature at which molecular motion is at a minimum."},
    {question:"The second law of thermodynamics implies that:",context:"",options:["A) Energy is always conserved","B) Heat can flow spontaneously from cold to hot","C) No heat engine can be 100% efficient","D) Internal energy is constant in an isolated system"],correct:2,explanation:"The second law states that entropy of an isolated system never decreases, which means no heat engine operating between two temperatures can be 100% efficient."},
    {question:"A 0.50 kg block of aluminium (c = 900 J kg⁻¹ K⁻¹) at 80 °C is placed in 1.0 kg of water (c = 4200 J kg⁻¹ K⁻¹) at 20 °C. Assuming no heat loss, which equation gives the final temperature T?",context:"",options:["A) 0.50 × 900 × (T − 80) = 1.0 × 4200 × (20 − T)","B) 0.50 × 900 × (80 − T) = 1.0 × 4200 × (T − 20)","C) 0.50 × 4200 × (80 − T) = 1.0 × 900 × (T − 20)","D) 0.50 × 900 + 1.0 × 4200 = T"],correct:1,explanation:"Heat lost by aluminium = heat gained by water: m_Al × c_Al × (T_Al − T) = m_w × c_w × (T − T_w)."},
    {question:"Which graph correctly shows how the pressure of a fixed mass of ideal gas varies with volume at constant temperature?",context:"",options:["A) A straight line through the origin","B) A hyperbola (PV = constant)","C) A straight line with positive gradient","D) An exponential curve"],correct:1,explanation:"Boyle's law: P ∝ 1/V at constant T, giving PV = constant — a hyperbola on a P–V graph."},
    {question:"The Boltzmann constant k_B relates:",context:"",options:["A) Pressure and volume of a gas","B) Energy of a photon to its frequency","C) Average molecular kinetic energy to temperature","D) Entropy change to heat transferred"],correct:2,explanation:"k_B appears in ⟨Ek⟩ = (3/2)k_BT, relating average molecular kinetic energy to absolute temperature. k_B = 1.38 × 10⁻²³ J K⁻¹."},
    {question:"In a gas, pressure arises because:",context:"",options:["A) Molecules attract the walls of the container","B) Molecules collide with the walls, transferring momentum","C) The gas has weight pushing down","D) Molecules repel each other, pushing outward"],correct:1,explanation:"Gas pressure is caused by molecules colliding with the container walls and transferring momentum to them. The rate of momentum transfer per unit area gives pressure."},
    {question:"A heat engine absorbs 800 J from a hot reservoir and exhausts 500 J to a cold reservoir. Its efficiency is:",context:"",options:["A) 37.5%","B) 62.5%","C) 60%","D) 160%"],correct:0,explanation:"η = (Q_H − Q_C)/Q_H = (800 − 500)/800 = 300/800 = 0.375 = 37.5%."},
    {question:"Increasing the temperature of a fixed volume of gas increases the pressure because:",context:"",options:["A) Molecules become larger","B) The number of molecules increases","C) Molecules collide with walls more frequently and with greater force","D) The gas leaks out, reducing volume"],correct:2,explanation:"Higher temperature means molecules move faster: they hit the walls more often and with greater momentum, increasing the average force per unit area (pressure)."},
    {question:"Which of the following describes an isobaric process?",context:"",options:["A) Constant temperature","B) Constant pressure","C) No heat exchange","D) Constant volume"],correct:1,explanation:"Isobaric means constant pressure. In this case W = PΔV and ΔU = Q − PΔV."},
    {question:"The specific latent heat of fusion of ice is 3.34 × 10⁵ J kg⁻¹. How much energy is released when 200 g of water freezes?",context:"",options:["A) 1.67 × 10³ J","B) 6.68 × 10⁴ J","C) 3.34 × 10⁵ J","D) 1.67 × 10⁶ J"],correct:1,explanation:"Q = mL = 0.200 × 3.34 × 10⁵ = 6.68 × 10⁴ J. Energy is released when freezing (exothermic)."},
    {question:"Gas at 27 °C and 1.0 × 10⁵ Pa is heated at constant volume to 127 °C. The new pressure is:",context:"",options:["A) 0.75 × 10⁵ Pa","B) 1.33 × 10⁵ Pa","C) 2.0 × 10⁵ Pa","D) 4.7 × 10⁵ Pa"],correct:1,explanation:"Gay-Lussac's law (constant V): P/T = constant. P₂ = P₁ × T₂/T₁ = 1.0 × 10⁵ × 400/300 ≈ 1.33 × 10⁵ Pa. (Convert °C to K first!)"}
  ],
  4: [
    {question:"A wave has a frequency of 250 Hz and a wavelength of 1.4 m. Its speed is:",context:"",options:["A) 178 m s⁻¹","B) 250 m s⁻¹","C) 350 m s⁻¹","D) 400 m s⁻¹"],correct:2,explanation:"v = fλ = 250 × 1.4 = 350 m s⁻¹."},
    {question:"Which of the following correctly distinguishes transverse from longitudinal waves?",context:"",options:["A) Transverse waves cannot travel through a vacuum; longitudinal can","B) In transverse waves, particles oscillate parallel to wave travel; in longitudinal waves, perpendicular","C) In transverse waves, particles oscillate perpendicular to wave travel; in longitudinal waves, parallel","D) Transverse waves transfer energy; longitudinal waves do not"],correct:2,explanation:"Transverse: oscillation ⊥ to propagation (e.g. light, S-waves). Longitudinal: oscillation ∥ to propagation (e.g. sound, P-waves)."},
    {question:"The period of a wave is 0.020 s. Its frequency is:",context:"",options:["A) 0.020 Hz","B) 5.0 Hz","C) 50 Hz","D) 500 Hz"],correct:2,explanation:"f = 1/T = 1/0.020 = 50 Hz."},
    {question:"Which of the following is a longitudinal wave?",context:"",options:["A) Light","B) Water surface waves","C) Sound","D) Seismic S-waves"],correct:2,explanation:"Sound is a longitudinal wave — air molecules oscillate back and forth parallel to the direction of wave propagation, creating compressions and rarefactions."},
    {question:"The intensity of a wave is proportional to:",context:"",options:["A) Amplitude","B) Frequency","C) The square of amplitude","D) The square of frequency"],correct:2,explanation:"Intensity I ∝ A². Doubling the amplitude quadruples the intensity."},
    {question:"A light ray passes from air (n = 1.00) into glass (n = 1.50) at an angle of incidence of 40°. Using Snell's law, the angle of refraction is:",context:"",options:["A) 25.4°","B) 40.0°","C) 60.0°","D) 74.6°"],correct:0,explanation:"n₁ sinθ₁ = n₂ sinθ₂ → sin θ₂ = (1.00/1.50) × sin40° = 0.667 × 0.643 = 0.429 → θ₂ = 25.4°."},
    {question:"When a wave moves from a less dense to a more dense medium, which quantity remains unchanged?",context:"",options:["A) Speed","B) Wavelength","C) Frequency","D) Direction"],correct:2,explanation:"Frequency is determined by the source and remains constant when a wave changes medium. Speed and wavelength both change; direction changes if the wave is not normal to the boundary."},
    {question:"Two coherent sources produce constructive interference at a point. The path difference at that point must be:",context:"",options:["A) An odd multiple of λ/2","B) Any multiple of λ","C) Exactly λ/4","D) Zero only"],correct:1,explanation:"Constructive interference occurs when path difference = nλ (n = 0, 1, 2, …), giving a phase difference of 2nπ."},
    {question:"In Young's double-slit experiment, the fringe separation Δy is given by:",context:"",options:["A) Δy = dλ/D","B) Δy = λD/d","C) Δy = λd/D","D) Δy = D/(λd)"],correct:1,explanation:"Δy = λD/d, where λ is wavelength, D is the distance to the screen, and d is the slit separation."},
    {question:"The fringe spacing in a Young's double-slit experiment is 2.0 mm. If the wavelength is doubled and the slit separation is halved, the new fringe spacing is:",context:"",options:["A) 1.0 mm","B) 2.0 mm","C) 4.0 mm","D) 8.0 mm"],correct:3,explanation:"Δy ∝ λ/d. Doubling λ and halving d both increase Δy: new Δy = 2.0 × 2 × 2 = 8.0 mm."},
    {question:"A standing wave is formed in a string fixed at both ends. The distance between adjacent nodes is:",context:"",options:["A) λ","B) λ/4","C) λ/2","D) 2λ"],correct:2,explanation:"Adjacent nodes (or antinodes) in a standing wave are separated by half a wavelength, λ/2."},
    {question:"A pipe open at both ends has a fundamental frequency of 170 Hz. The speed of sound is 340 m s⁻¹. The length of the pipe is:",context:"",options:["A) 0.50 m","B) 1.0 m","C) 2.0 m","D) 0.25 m"],correct:1,explanation:"For a pipe open at both ends: f₁ = v/(2L) → L = v/(2f₁) = 340/(2×170) = 1.0 m."},
    {question:"Which of the following correctly describes a node in a standing wave?",context:"",options:["A) A point of maximum displacement","B) A point of zero displacement at all times","C) A point where amplitude changes sign","D) A point where two waves meet"],correct:1,explanation:"A node is a point of permanent zero displacement — destructive superposition occurs there at all times."},
    {question:"A pipe closed at one end and open at the other supports only odd harmonics. The third harmonic has a frequency of 510 Hz. The fundamental frequency is:",context:"",options:["A) 170 Hz","B) 255 Hz","C) 340 Hz","D) 1530 Hz"],correct:0,explanation:"For a closed pipe, harmonics are odd multiples: f₃ = 3f₁ → f₁ = 510/3 = 170 Hz."},
    {question:"The principle of superposition states that:",context:"",options:["A) Waves always interfere constructively","B) The resultant displacement at a point is the vector sum of individual displacements","C) Waves destroy each other when they meet","D) Only identical waves can superpose"],correct:1,explanation:"Superposition: when two or more waves overlap, the resultant displacement at any point is the algebraic sum of the individual displacements."},
    {question:"Which condition is required for two sources to produce a stable interference pattern?",context:"",options:["A) They must have the same amplitude","B) They must be coherent — same frequency and constant phase relationship","C) They must be the same type of wave","D) They must be in phase with each other"],correct:1,explanation:"Coherence is essential: the sources must have the same frequency and a constant phase difference. The amplitudes need not be equal, and they need not be in phase."},
    {question:"Total internal reflection occurs when:",context:"",options:["A) Light travels from a denser to a less dense medium at an angle greater than the critical angle","B) Light travels from a less dense to a denser medium","C) The angle of incidence equals the angle of refraction","D) The refractive index is less than 1"],correct:0,explanation:"Total internal reflection occurs when light travels from a denser medium to a less dense medium and the angle of incidence exceeds the critical angle θ_c = arcsin(n₂/n₁)."},
    {question:"The critical angle for glass (n = 1.50) to air (n = 1.00) is:",context:"",options:["A) 33.6°","B) 41.8°","C) 48.2°","D) 56.4°"],correct:1,explanation:"sin θ_c = n₂/n₁ = 1.00/1.50 = 0.667 → θ_c = arcsin(0.667) ≈ 41.8°."},
    {question:"Diffraction is most significant when the gap width is:",context:"",options:["A) Much larger than the wavelength","B) Much smaller than the wavelength","C) Approximately equal to the wavelength","D) Exactly twice the wavelength"],correct:2,explanation:"Diffraction is most pronounced when the aperture or obstacle size is approximately equal to the wavelength of the wave."},
    {question:"In a string fixed at both ends vibrating in its third harmonic, the number of antinodes is:",context:"",options:["A) 1","B) 2","C) 3","D) 4"],correct:2,explanation:"The nth harmonic of a string fixed at both ends has n antinodes (and n+1 nodes including the fixed ends). Third harmonic → 3 antinodes."},
    {question:"A sound wave travels through air at 340 m s⁻¹ with a frequency of 680 Hz. Its wavelength is:",context:"",options:["A) 0.25 m","B) 0.50 m","C) 1.0 m","D) 2.0 m"],correct:1,explanation:"λ = v/f = 340/680 = 0.50 m."},
    {question:"Destructive interference occurs when the path difference between two coherent sources is:",context:"",options:["A) nλ","B) (n + ½)λ","C) nλ/2","D) 2nλ"],correct:1,explanation:"Destructive interference: path difference = (n + ½)λ for n = 0, 1, 2, …, giving a phase difference of (2n+1)π."},
    {question:"The refractive index of a medium is 1.6. The speed of light in that medium is: (c = 3.0 × 10⁸ m s⁻¹)",context:"",options:["A) 4.8 × 10⁸ m s⁻¹","B) 3.0 × 10⁸ m s⁻¹","C) 1.875 × 10⁸ m s⁻¹","D) 1.6 × 10⁸ m s⁻¹"],correct:2,explanation:"n = c/v → v = c/n = 3.0 × 10⁸ / 1.6 = 1.875 × 10⁸ m s⁻¹."},
    {question:"Which of the following waves can be polarised?",context:"",options:["A) Sound waves","B) Seismic P-waves","C) Light waves","D) All mechanical waves"],correct:2,explanation:"Only transverse waves can be polarised. Light is transverse and can be polarised. Sound and P-waves are longitudinal and cannot be polarised."},
    {question:"In a Young's double-slit experiment, the slit separation is 0.50 mm, the screen is 2.0 m away, and the fringe spacing is 2.4 mm. The wavelength of the light is:",context:"",options:["A) 400 nm","B) 500 nm","C) 600 nm","D) 700 nm"],correct:2,explanation:"λ = Δy × d / D = (2.4 × 10⁻³ × 0.50 × 10⁻³) / 2.0 = 6.0 × 10⁻⁷ m = 600 nm."},
    {question:"The amplitude of a wave is halved. The intensity changes by a factor of:",context:"",options:["A) 1/2","B) 1/4","C) 2","D) 4"],correct:1,explanation:"I ∝ A², so halving A reduces intensity by (1/2)² = 1/4."},
    {question:"A string of length 0.80 m is fixed at both ends. The wavelength of the fundamental mode is:",context:"",options:["A) 0.40 m","B) 0.80 m","C) 1.6 m","D) 3.2 m"],correct:2,explanation:"Fundamental mode: L = λ/2 → λ = 2L = 2 × 0.80 = 1.6 m."},
    {question:"Which statement about standing waves is correct?",context:"",options:["A) They transfer energy along the medium","B) They are formed by a single wave reflecting off a boundary","C) Adjacent antinodes are separated by one full wavelength","D) Energy is stored in the pattern but not transported"],correct:3,explanation:"Standing waves store energy in oscillating segments but do not transport energy along the medium. They are formed by superposition of two waves of equal frequency travelling in opposite directions."},
    {question:"Light of wavelength 500 nm passes through a single slit of width 0.20 mm. The angle of the first diffraction minimum is:",context:"",options:["A) 0.14°","B) 0.29°","C) 1.4°","D) 2.9°"],correct:0,explanation:"For single slit: sin θ = λ/b = 500×10⁻⁹ / 0.20×10⁻³ = 2.5×10⁻³ → θ ≈ 0.14°."},
    {question:"Which of the following best explains why sound can be heard around corners but light cannot?",context:"",options:["A) Sound travels faster than light","B) Sound has a much longer wavelength than typical gap sizes, so it diffracts significantly; light has a very short wavelength","C) Light is a transverse wave; sound is not","D) Sound has higher frequency than light"],correct:1,explanation:"Diffraction is significant when wavelength ≈ gap size. Sound (λ ~ 0.1–10 m) diffracts easily around everyday obstacles; visible light (λ ~ 400–700 nm) diffracts negligibly around them."}

  5: [
    {question:"Two point charges of +3 μC and +3 μC are separated by 0.30 m. The magnitude of the electrostatic force between them is: (k = 8.99 × 10⁹ N m² C⁻²)",context:"",options:["A) 0.90 N","B) 9.0 × 10⁻³ N","C) 0.90 × 10⁻³ N","D) 9.0 N"],correct:0,explanation:"F = kq₁q₂/r² = (8.99×10⁹ × 3×10⁻⁶ × 3×10⁻⁶) / 0.09 = (8.99×10⁹ × 9×10⁻¹²) / 0.09 = 0.0809/0.09 ≈ 0.90 N."},
    {question:"The electric field strength at a point in space is defined as:",context:"",options:["A) The force between two charges","B) The force per unit positive test charge placed at that point","C) The potential energy per unit charge","D) The work done per unit charge around a closed loop"],correct:1,explanation:"Electric field E = F/q — the force experienced per unit positive test charge. It is a vector pointing in the direction of force on a positive charge."},
    {question:"The electric potential at a distance r from a point charge Q is V = kQ/r. Moving a charge q from potential V₁ to V₂ requires work:",context:"",options:["A) W = q(V₁ − V₂)","B) W = q(V₂ − V₁)","C) W = qV₁V₂","D) W = q/ΔV"],correct:1,explanation:"Work done = charge × potential difference = q(V₂ − V₁). This is positive if moving a positive charge to higher potential."},
    {question:"A capacitor has capacitance C = 40 μF and is charged to 12 V. The charge stored is:",context:"",options:["A) 3.3 μC","B) 48 μC","C) 480 μC","D) 0.48 C"],correct:2,explanation:"Q = CV = 40×10⁻⁶ × 12 = 480×10⁻⁶ C = 480 μC."},
    {question:"The energy stored in a capacitor of capacitance C charged to voltage V is:",context:"",options:["A) CV","B) ½CV","C) ½CV²","D) CV²"],correct:2,explanation:"Energy stored U = ½CV². This can also be written as Q²/(2C) or ½QV."},
    {question:"A current of 2.0 A flows through a wire for 5.0 minutes. The total charge that passes is:",context:"",options:["A) 10 C","B) 150 C","C) 600 C","D) 2.5 C"],correct:2,explanation:"Q = It = 2.0 × (5.0 × 60) = 2.0 × 300 = 600 C."},
    {question:"A 6.0 Ω resistor and a 3.0 Ω resistor are connected in parallel. Their combined resistance is:",context:"",options:["A) 9.0 Ω","B) 4.5 Ω","C) 2.0 Ω","D) 0.50 Ω"],correct:2,explanation:"1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 → R = 2.0 Ω."},
    {question:"Kirchhoff's current law (KCL) states that:",context:"",options:["A) The sum of EMFs around a closed loop equals the sum of potential drops","B) The sum of currents entering a junction equals the sum leaving it","C) Current is inversely proportional to resistance","D) Power equals current times voltage"],correct:1,explanation:"KCL (junction rule): conservation of charge means the total current into any junction equals the total current out."},
    {question:"A battery of EMF 9.0 V has internal resistance 1.0 Ω. When connected to an external resistance of 8.0 Ω, the terminal voltage is:",context:"",options:["A) 9.0 V","B) 8.0 V","C) 1.0 V","D) 7.0 V"],correct:1,explanation:"I = EMF/(R+r) = 9.0/9.0 = 1.0 A. Terminal voltage = EMF − Ir = 9.0 − 1.0×1.0 = 8.0 V."},
    {question:"The resistance of a wire of resistivity ρ = 1.7×10⁻⁸ Ω m, length 2.0 m and cross-sectional area 1.0×10⁻⁶ m² is:",context:"",options:["A) 8.5×10⁻³ Ω","B) 3.4×10⁻² Ω","C) 1.7×10⁻² Ω","D) 8.5×10⁻² Ω"],correct:1,explanation:"R = ρL/A = (1.7×10⁻⁸ × 2.0) / 1.0×10⁻⁶ = 3.4×10⁻⁸ / 10⁻⁶ = 3.4×10⁻² Ω."},
    {question:"A 60 W lamp is connected to a 120 V supply. The current through it is:",context:"",options:["A) 0.50 A","B) 2.0 A","C) 7200 A","D) 0.25 A"],correct:0,explanation:"P = IV → I = P/V = 60/120 = 0.50 A."},
    {question:"The power dissipated in a 20 Ω resistor carrying a current of 3.0 A is:",context:"",options:["A) 60 W","B) 180 W","C) 0.15 W","D) 1.5 W"],correct:1,explanation:"P = I²R = 3.0² × 20 = 9.0 × 20 = 180 W."},
    {question:"A magnetic force acts on a current-carrying conductor. The force is zero when the conductor is:",context:"",options:["A) Perpendicular to the magnetic field","B) Parallel to the magnetic field","C) At 45° to the magnetic field","D) Moving with the field"],correct:1,explanation:"F = BIL sinθ. When the conductor is parallel to B, θ = 0°, sin0° = 0, so F = 0."},
    {question:"The force on a positive charge q moving at velocity v perpendicular to a magnetic field B is:",context:"",options:["A) qvB directed along v","B) qvB directed along B","C) qvB directed perpendicular to both v and B","D) qv/B"],correct:2,explanation:"The Lorentz force F = qv × B is perpendicular to both the velocity and the field. This causes circular motion but does no work on the charge."},
    {question:"A charged particle moves in a circle of radius r in a magnetic field B. The radius is given by r = mv/(qB). If the speed is doubled, the radius:",context:"",options:["A) Halves","B) Stays the same","C) Doubles","D) Quadruples"],correct:2,explanation:"r = mv/(qB). If v doubles and m, q, B are unchanged, r doubles."},
    {question:"Faraday's law states that the induced EMF is:",context:"",options:["A) Proportional to the magnetic field strength","B) Equal to the rate of change of magnetic flux linkage","C) Equal to the charge stored in the field","D) Proportional to the current in the primary coil"],correct:1,explanation:"Faraday's law: ε = −N(dΦ/dt). The induced EMF equals the rate of change of magnetic flux linkage (with a negative sign from Lenz's law)."},
    {question:"Lenz's law states that the induced current always:",context:"",options:["A) Flows in the same direction as the inducing current","B) Opposes the change in flux that caused it","C) Increases the flux through the circuit","D) Flows from high to low potential"],correct:1,explanation:"Lenz's law: the induced current flows in a direction to oppose the change in magnetic flux. This is the physical basis for the negative sign in Faraday's law."},
    {question:"Magnetic flux is defined as Φ = BA cosθ. Which situation gives zero flux?",context:"",options:["A) B parallel to the plane of the coil (θ = 90°)","B) B perpendicular to the plane of the coil (θ = 0°)","C) B at 45° to the normal of the coil","D) A large area coil in a strong field"],correct:0,explanation:"Φ = BA cosθ where θ is the angle between B and the normal to the area. When B is parallel to the plane, θ = 90° and cos90° = 0, so Φ = 0."},
    {question:"An ideal step-up transformer has 100 turns on the primary and 500 turns on the secondary. If the primary voltage is 20 V, the secondary voltage is:",context:"",options:["A) 4 V","B) 20 V","C) 100 V","D) 500 V"],correct:2,explanation:"Vs/Vp = Ns/Np → Vs = Vp × (Ns/Np) = 20 × (500/100) = 100 V."},
    {question:"For the same transformer above, if the primary current is 10 A, the secondary current is:",context:"",options:["A) 2 A","B) 10 A","C) 50 A","D) 5 A"],correct:0,explanation:"Ip/Is = Ns/Np → Is = Ip × (Np/Ns) = 10 × (100/500) = 2 A. Power is conserved in an ideal transformer."},
    {question:"Electric field lines around a positive point charge:",context:"",options:["A) Form closed loops","B) Point radially inward toward the charge","C) Point radially outward from the charge","D) Are parallel and evenly spaced"],correct:2,explanation:"Field lines point in the direction a positive test charge would move — away from a positive source charge (radially outward)."},
    {question:"Two capacitors of 6 μF and 3 μF are connected in series. Their combined capacitance is:",context:"",options:["A) 9 μF","B) 4.5 μF","C) 2 μF","D) 18 μF"],correct:2,explanation:"1/C = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 → C = 2 μF. Series capacitors combine like parallel resistors."},
    {question:"Ohm's law applies to a component when:",context:"",options:["A) Current is proportional to the square of voltage","B) Resistance decreases as temperature increases","C) Current is directly proportional to voltage at constant temperature","D) Voltage is independent of current"],correct:2,explanation:"Ohm's law: V = IR, where R is constant. The component is ohmic if the V–I graph is a straight line through the origin at constant temperature."},
    {question:"A wire carrying current I experiences a force F in a magnetic field B. If the current is tripled and the length of wire doubled, the force becomes:",context:"",options:["A) 3F","B) 5F","C) 6F","D) 9F"],correct:2,explanation:"F = BIL sinθ. Tripling I and doubling L: F_new = B(3I)(2L)sinθ = 6BIL sinθ = 6F."},
    {question:"The electric potential difference between two points is 12 V. The energy required to move a charge of 3.0 C between the points is:",context:"",options:["A) 4.0 J","B) 15 J","C) 36 J","D) 0.25 J"],correct:2,explanation:"W = qV = 3.0 × 12 = 36 J."},
    {question:"Which of the following correctly describes the relationship between electric field E and potential V?",context:"",options:["A) E = V × d","B) E = ΔV/Δr (in magnitude)","C) V = E²/r","D) E = V²/r"],correct:1,explanation:"E = −dV/dr, so the magnitude of E equals the potential gradient (rate of change of potential with distance). Between parallel plates, E = V/d."},
    {question:"A proton (charge +e) moves at 2.0 × 10⁶ m s⁻¹ perpendicular to a field of 0.050 T. The magnetic force on it is: (e = 1.6 × 10⁻¹⁹ C)",context:"",options:["A) 1.6 × 10⁻¹⁴ N","B) 3.2 × 10⁻¹⁴ N","C) 1.6 × 10⁻¹² N","D) 6.4 × 10⁻¹⁴ N"],correct:0,explanation:"F = qvB = 1.6×10⁻¹⁹ × 2.0×10⁶ × 0.050 = 1.6×10⁻¹⁴ N."},
    {question:"Three resistors of 4 Ω, 6 Ω, and 12 Ω are connected in parallel. The equivalent resistance is:",context:"",options:["A) 22 Ω","B) 7.3 Ω","C) 2.0 Ω","D) 3.0 Ω"],correct:2,explanation:"1/R = 1/4 + 1/6 + 1/12 = 3/12 + 2/12 + 1/12 = 6/12 = 1/2 → R = 2.0 Ω."},
    {question:"High-voltage transmission lines reduce energy loss because:",context:"",options:["A) High voltage increases resistance","B) High voltage reduces current, and power loss P = I²R decreases","C) High voltage increases the speed of electrons","D) High voltage eliminates the need for transformers"],correct:1,explanation:"P_loss = I²R. Transmitting at high voltage means lower current for the same power (P = IV). Lower I dramatically reduces resistive heating losses I²R."},
    {question:"A coil of 200 turns has a magnetic flux of 5.0 × 10⁻³ Wb. The flux linkage is:",context:"",options:["A) 2.5 × 10⁻⁵ Wb","B) 5.0 × 10⁻³ Wb","C) 1.0 Wb","D) 40 Wb"],correct:2,explanation:"Flux linkage = NΦ = 200 × 5.0×10⁻³ = 1.0 Wb."}
