    subtitle:'When you combine measured quantities mathematically, their uncertainties combine too. These rules tell you exactly how.',
    body:`
<h3>The Rules</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 20px;margin:16px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase">Uncertainty Propagation Rules</div>
  <p style="font-size:14px;color:#cccce0;margin-bottom:8px"><strong style="color:var(--accent2)">Addition / Subtraction:</strong> add absolute uncertainties<br><span style="font-family:'Space Mono',monospace">Δz = Δa + Δb &nbsp; where z = a ± b</span></p>
  <p style="font-size:14px;color:#cccce0;margin-bottom:8px"><strong style="color:var(--accent2)">Multiplication / Division:</strong> add fractional (or %) uncertainties<br><span style="font-family:'Space Mono',monospace">Δz/z = Δa/a + Δb/b &nbsp; where z = a × b or a/b</span></p>
  <p style="font-size:14px;color:#cccce0;margin:0"><strong style="color:var(--accent2)">Power:</strong> multiply fractional uncertainty by the power<br><span style="font-family:'Space Mono',monospace">Δz/z = |n| × Δa/a &nbsp; where z = aⁿ</span></p>
</div>
<h3>Worked Example</h3>
<p>A rectangle has sides a = 5.0 ± 0.2 cm and b = 3.0 ± 0.1 cm. Find the area and its uncertainty.</p>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:14px;color:#cccce0;line-height:1.9">
  Area = a × b = 5.0 × 3.0 = <strong>15.0 cm²</strong><br>
  %Δa = (0.2/5.0) × 100% = 4.0%<br>
  %Δb = (0.1/3.0) × 100% = 3.3%<br>
  %ΔArea = 4.0% + 3.3% = <strong>7.3%</strong><br>
  ΔArea = 0.073 × 15.0 = <strong>1.1 cm²</strong><br>
  Result: <strong>Area = 15.0 ± 1.1 cm²</strong>
</div>
<h3>Key Point</h3>
<p>Uncertainties always <em>add</em> — never subtract. Even if you are subtracting two quantities, you add their absolute uncertainties. This means the uncertainty in a <em>difference</em> can be large if the two values are similar in size.</p>`

  // ── LESSON 6: Vectors vs Scalars ────────────────────────────────────────────
  {

    title:'Vectors and Scalars',
    subtitle:'Every physical quantity is either a scalar (just a size) or a vector (a size AND a direction). This distinction matters in every topic of the course.',
    body:`
<h3>Scalars — Magnitude Only</h3>
<p>A <strong>scalar</strong> is completely described by a number and a unit. Direction is irrelevant.</p>
<p><em>Examples:</em> distance, speed, mass, energy, temperature, time, pressure, volume, density</p>
<h3>Vectors — Magnitude AND Direction</h3>
<p>A <strong>vector</strong> requires both a magnitude and a direction to be fully described.</p>
<p><em>Examples:</em> displacement, velocity, acceleration, force, momentum, electric field, gravitational field</p>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:16px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">COMMON TRAP</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Speed and velocity are different! Speed is a scalar (how fast). Velocity is a vector (how fast AND in which direction). The same applies to distance (scalar) vs displacement (vector).</p>
</div>
<h3>Representing Vectors</h3>
<p>Vectors are drawn as arrows. The <strong>length</strong> represents magnitude; the <strong>direction</strong> of the arrow shows the vector's direction. In equations, vectors are often written in bold (<strong>F</strong>) or with an arrow (→F).</p>`
  },
  // ── LESSON 7: Adding Vectors ────────────────────────────────────────────────
  {
    type:'lesson',
    tag:'Lesson 7 of 9 · Vectors & Scalars',
    title:'Adding & Subtracting Vectors',
    subtitle:'You cannot simply add vector magnitudes together — direction matters. Here are two methods to find the resultant.',
    body:`
<h3>Method 1: Tip-to-Tail (Graphical)</h3>
<p>Draw the first vector. From its tip (arrow end), draw the second vector. The <strong>resultant</strong> is the arrow drawn from the tail of the first to the tip of the last.</p>
<h3>Method 2: Components (Algebraic) — More Reliable</h3>
<p>Break each vector into horizontal (x) and vertical (y) components, add the components separately, then recombine.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 20px;margin:16px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase">Component Method</div>
  <p style="font-size:14px;font-family:'Space Mono',monospace;color:#cccce0;line-height:2;margin:0">
    Aₓ = A cos θ &nbsp;&nbsp; Aᵧ = A sin θ<br>
    Rₓ = Aₓ + Bₓ &nbsp;&nbsp; Rᵧ = Aᵧ + Bᵧ<br>
    |R| = √(Rₓ² + Rᵧ²)<br>
    θᵣ = arctan(Rᵧ / Rₓ)
  </p>
</div>
<h3>Worked Example</h3>
<p>A boat moves 40 m east then 30 m north. Find the resultant displacement.</p>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:14px;color:#cccce0;line-height:1.9">
  x-component: 40 + 0 = 40 m<br>
  y-component: 0 + 30 = 30 m<br>
  Magnitude = √(40² + 30²) = √(1600 + 900) = √2500 = <strong>50 m</strong><br>
  Direction = arctan(30/40) = arctan(0.75) = <strong>36.9° north of east</strong>
</div>
<h3>Vector Subtraction</h3>
<p>To find <strong>A − B</strong>, reverse the direction of <strong>B</strong> (making it <strong>−B</strong>), then add: <strong>A + (−B)</strong>. This is used when finding changes in velocity.</p>`
  },
  // ── LESSON 8: Resolving Vectors ────────────────────────────────────────────
  {
    type:'lesson',
    tag:'Lesson 8 of 9 · Vectors & Scalars',
    title:'Resolving Vectors into Components',
    subtitle:'Breaking a single vector into two perpendicular parts is one of the most-used skills in all of IB Physics.',
    body:`
<h3>What Does "Resolving" Mean?</h3>
<p>Any vector can be split into two <strong>perpendicular components</strong> — usually horizontal and vertical. These components act <em>independently</em> of each other.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 20px;margin:16px 0">
  <div style="font-size:10px;color:var(--muted);margin-bottom:10px;letter-spacing:.1em;text-transform:uppercase">Resolving a Vector F at angle θ to horizontal</div>
  <p style="font-size:15px;font-family:'Space Mono',monospace;color:#cccce0;line-height:2;margin:0">
    Horizontal: Fₓ = F cos θ<br>
    Vertical: &nbsp;&nbsp;Fᵧ = F sin θ
  </p>
</div>
<h3>The Memory Trick</h3>
<p>θ is always measured from the <em>reference direction</em>. The component <em>along</em> that reference uses <strong>cos θ</strong>; the component <em>perpendicular to it</em> uses <strong>sin θ</strong>.</p>
<h3>Example</h3>
<p>A 50 N force acts at 37° above the horizontal. Its components are:</p>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:14px;color:#cccce0;line-height:1.9">
  Horizontal: 50 cos 37° = 50 × 0.799 = <strong>40.0 N</strong><br>
  Vertical: &nbsp;&nbsp;50 sin 37° = 50 × 0.602 = <strong>30.1 N</strong><br>
  Check: √(40² + 30.1²) ≈ 50 N ✓
</div>
<h3>Where You'll Use This</h3>
<ul>

let guidedStep = 0;
let guidedQuizAnswers = {};
let currentGuidedTopic = 1;

function saveProgress(topicId){
  try{
    localStorage.setItem(`gl_step_${topicId}`, guidedStep);
    localStorage.setItem(`gl_answers_${topicId}`, JSON.stringify(guidedQuizAnswers));
  }catch(e){}
}

function loadProgress(topicId){
  try{
    const step = localStorage.getItem(`gl_step_${topicId}`);
    const answers = localStorage.getItem(`gl_answers_${topicId}`);
    guidedStep = step !== null ? parseInt(step, 10) : 0;
    guidedQuizAnswers = answers ? JSON.parse(answers) : {};
  }catch(e){
    guidedStep = 0;
    guidedQuizAnswers = {};
  }
}

function clearProgress(topicId){
  try{
    localStorage.removeItem(`gl_step_${topicId}`);
    localStorage.removeItem(`gl_answers_${topicId}`);
  }catch(e){}
}

function showGuidedLesson(topicId){
  currentGuidedTopic = topicId || 1;
  loadProgress(currentGuidedTopic);
  currentView = 'guided';
  setActiveNav(`topic-${currentGuidedTopic}`);
  document.getElementById('home').style.display='none';
  document.getElementById('lesson').style.display='none';
  document.getElementById('guided-lesson').style.display='block';
  document.getElementById('quiz').style.display='none';
  const titles={1:'TOPIC 01 — MEASUREMENTS & UNCERTAINTIES',2:'TOPIC 02 — MECHANICS',3:'TOPIC 03 — THERMAL PHYSICS',4:'TOPIC 04 — WAVES',5:'TOPIC 05 — ELECTRICITY & MAGNETISM',6:'TOPIC 06 — CIRCULAR & GRAVITATIONAL MOTION (AHL)'};
  setTopbarTitle(titles[currentGuidedTopic]||'GUIDED LESSON');
  renderGuidedStep();
  scrollToTop();
  focusMain();
  announce(`Topic ${currentGuidedTopic} guided lesson — step ${guidedStep+1} of ${getActiveSteps().length}`);
}

function restartGuidedLesson(topicId){
  clearProgress(topicId);
  guidedStep = 0;
  guidedQuizAnswers = {};
  saveProgress(topicId);
  scrollToTop();
  renderGuidedStep();
  announce('Restarted from step 1');
}

function getActiveSteps(){
  if(currentGuidedTopic===2) return GUIDED_STEPS_2;
  if(currentGuidedTopic===3) return GUIDED_STEPS_3;
  if(currentGuidedTopic===4) return GUIDED_STEPS_4;
  if(currentGuidedTopic===5) return GUIDED_STEPS_5;
  if(currentGuidedTopic===6) return GUIDED_STEPS_6;
  return GUIDED_STEPS;
}

function renderGuidedStep(){
  const steps = getActiveSteps();
  const step = steps[guidedStep];
  const total = steps.length;
  const pct = Math.round((guidedStep / (total-1)) * 100);
  const isFirst = guidedStep === 0;
  const isLast = guidedStep === total - 1;

  let content = '';

  if(step.type === 'lesson'){
    content = `
      <div class="gl-step">
        <div class="gl-step-tag">${step.tag}</div>
        <h2 class="gl-step-title">${step.title}</h2>
        <p class="gl-step-subtitle">${step.subtitle}</p>
        <hr class="gl-divider">
        <div class="gl-body">${step.body}</div>
      </div>`;
  } else if(step.type === 'quiz'){
    const answered = guidedQuizAnswers[guidedStep];
    content = `
      <div class="gl-step">
        <div class="gl-step-tag">${step.tag}</div>
        <h2 class="gl-step-title">${step.title}</h2>
        <hr class="gl-divider">
        ${step.questions.map((q,qi)=>{
          const sel = answered ? answered[qi] : undefined;
          const isAnswered = sel !== undefined;
          return `<div class="gl-mini-quiz" id="mq-${guidedStep}-${qi}">
            <div class="gl-mq-label">Question ${qi+1} of ${step.questions.length}</div>
            <div class="gl-mq-q">${q.q}</div>
            <div class="gl-mq-opts">
              ${q.opts.map((opt,oi)=>{
                let cls = 'gl-mq-opt';
                if(isAnswered){
                  if(oi===q.correct) cls += ' correct';
                  else if(oi===sel && sel!==q.correct) cls += ' wrong';
                }
                return `<button class="${cls}" ${isAnswered?'disabled':''} onclick="answerGuidedQ(${guidedStep},${qi},${oi})"
                  aria-label="Option ${['A','B','C','D'][oi]}: ${opt}">
                  <span class="gl-mq-opt-letter">${['A','B','C','D'][oi]}</span>${opt}
                </button>`;
              }).join('')}
            </div>
            <div class="gl-mq-feedback ${isAnswered?(sel===q.correct?'show good':'show bad'):''}" id="fb-${guidedStep}-${qi}">
              ${isAnswered ? (sel===q.correct?'✓ Correct — ':'✗ Incorrect — ') + q.feedback : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
  } else if(step.type === 'complete'){
    const nextId = currentGuidedTopic + 1;
    const nextTopic = TOPICS.find(t=>t.id===nextId);
    content = `
      <div class="gl-step" style="text-align:center;padding-top:60px">
        <div style="font-size:48px;margin-bottom:20px">🎉</div>
        <div class="gl-step-tag" style="justify-content:center">${step.tag}</div>
        <h2 class="gl-step-title" style="font-size:28px">${step.title}</h2>
        <p class="gl-step-subtitle" style="max-width:480px;margin:0 auto 32px">${step.subtitle}</p>
        ${nextTopic?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:20px 24px;display:inline-flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;text-align:left;min-width:320px;margin-bottom:16px">
          <div>
            <div style="font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.1em;margin-bottom:4px">UP NEXT</div>
            <div style="font-size:16px;font-weight:600;color:var(--text)">Topic ${String(nextTopic.id).padStart(2,'0')}: ${nextTopic.title}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${nextTopic.subtopics.join(' · ')}</div>
          </div>
          <button class="btn btn-primary" onclick="showTopic(${nextTopic.id})" style="flex-shrink:0">Continue →</button>
        </div>`:''}
        <div style="margin-top:12px">
          <button class="btn btn-ghost" onclick="startQuiz(${currentGuidedTopic})" style="margin-right:10px">Take Full Topic ${currentGuidedTopic} Test</button>
          <button class="btn btn-ghost" onclick="showHome()">Back to Overview</button>
          <button class="btn btn-ghost" onclick="restartGuidedLesson(${currentGuidedTopic})" style="margin-left:10px;opacity:.6;font-size:12px">↺ Restart from Step 1</button>
        </div>
      </div>`;
  }

  let canAdvance = true;
  if(step.type === 'quiz'){
    const answers = guidedQuizAnswers[guidedStep];
    canAdvance = answers && Object.keys(answers).length === step.questions.length;
  }

  document.getElementById('guided-lesson').innerHTML = `
    <div class="gl-progress" aria-hidden="true"><div class="gl-progress-fill" style="width:${pct}%"></div></div>
    ${content}
    ${step.type !== 'complete' ? `
    <div class="gl-nav">
      <button class="btn btn-ghost" onclick="guidedBack()" ${isFirst?'disabled style="opacity:.3;cursor:default"':''} aria-label="Previous step">← Back</button>
      <span class="gl-step-counter">${guidedStep+1} / ${total}</span>
      <button class="btn btn-primary" id="gl-next-btn" onclick="guidedNext()" ${!canAdvance?'disabled style="opacity:.4;cursor:default"':''} aria-label="${isLast?'Finish':'Next step'}">
        ${step.type==='quiz' && !canAdvance ? 'Answer all questions →' : isLast ? 'Finish' : 'Next →'}
      </button>
    </div>` : ''}
  `;

  if(typeof renderMathInElement !== 'undefined'){
    renderMathInElement(document.getElementById('guided-lesson'), {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}],
      throwOnError:false
    });
  }
}

function answerGuidedQ(stepIdx, qIdx, optIdx){
  if(!guidedQuizAnswers[stepIdx]) guidedQuizAnswers[stepIdx] = {};
  if(guidedQuizAnswers[stepIdx][qIdx] !== undefined) return;
  guidedQuizAnswers[stepIdx][qIdx] = optIdx;
  saveProgress(currentGuidedTopic);
  const step = getActiveSteps()[stepIdx];
  const q = step.questions[qIdx];
  const correct = optIdx === q.correct;
  announce((correct ? 'Correct! ' : 'Incorrect. ') + q.feedback);
  renderGuidedStep();
}

function guidedNext(){
  const steps = getActiveSteps();
  const step = steps[guidedStep];
  if(step.type === 'quiz'){
    const answers = guidedQuizAnswers[guidedStep];
    if(!answers || Object.keys(answers).length < step.questions.length) return;
  }
  if(guidedStep < steps.length - 1){
    guidedStep++;
    saveProgress(currentGuidedTopic);
    scrollToTop();
    renderGuidedStep();
    announce(`Step ${guidedStep+1} of ${steps.length}`);
  }
}

function guidedBack(){
  if(guidedStep > 0){
    guidedStep--;
    saveProgress(currentGuidedTopic);
    scrollToTop();
    renderGuidedStep();
    announce(`Step ${guidedStep+1} of ${getActiveSteps().length}`);
  }
}

<h3>Distance vs Displacement</h3>

  // ── LESSON 4: Newton's Laws ──────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 4 of 10 · Newton\'s Laws',title:'Newton\'s Three Laws of Motion',
  subtitle:'Three laws published in 1687 still underpin all of classical mechanics. You need to know them precisely — not just vaguely.',
  body:`
<h3>First Law — Inertia</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0"><strong style="color:var(--accent2)">Law 1:</strong> A body remains at rest, or moves with constant velocity, unless acted upon by a resultant external force.</p>
</div>
<p>This means constant velocity (including rest) requires <strong>zero net force</strong> — forces can still act, but they must balance. "Inertia" is the tendency to resist changes in motion.</p>
<h3>Second Law — F = ma</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0"><strong style="color:var(--accent2)">Law 2:</strong> The resultant force on a body equals the rate of change of its momentum. For constant mass: <strong>F = ma</strong></p>
</div>
<p>F is the <em>net</em> (resultant) force in newtons. If multiple forces act, find their vector sum first.</p>
<h3>Third Law — Action-Reaction</h3>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0"><strong style="color:var(--accent2)">Law 3:</strong> When body A exerts a force on body B, body B exerts an equal and opposite force on body A.</p>
</div>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">CRITICAL POINT</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Newton's 3rd law pairs act on <em>different</em> objects — they are the same type of force, equal in magnitude, opposite in direction. They never cancel each other because cancellation requires forces on the <em>same</em> object.</p>
</div>`},

<h3>Drawing a Free Body Diagram (FBD)</h3>
<ol style="margin:10px 0 10px 20px;font-size:14px;color:#cccce0;line-height:1.9">
  <li>Represent the object as a single point or box</li>
  <li>Draw <strong>every force acting ON the object</strong> as an arrow from the centre, in the correct direction</li>
  <li>Label each force clearly (weight W or mg, normal N, friction f, tension T, applied force F…)</li>
  <li>Make arrow lengths proportional to magnitudes</li>
</ol>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">COMMON MISTAKE</div>
  <p style="font-size:13px;color:#cccce0;margin:0">Never include forces that the object exerts on other things — only forces acting ON the object. And never draw "centripetal force" as an extra arrow — it is provided by the other forces.</p>
</div>
<h3>Common Forces</h3>
<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0;font-size:13px;color:#cccce0">
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Weight (W = mg)</strong> — always vertically downward, toward Earth's centre</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Normal force (N)</strong> — perpendicular to the surface, away from it</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Friction (f = μN)</strong> — parallel to surface, opposing relative motion</div>
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px"><strong style="color:var(--accent)">Tension (T)</strong> — along a string or rope, pulling the object toward the attachment</div>
</div>
<h3>Friction</h3>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">f ≤ μₛN (static) &nbsp;&nbsp; f = μₖN (kinetic) &nbsp;&nbsp; always: μₛ > μₖ</p>`},

  // ── QUIZ 4 ──────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 4–5',title:'Newton\'s Laws & Forces — Check Your Understanding',
  questions:[
    {q:'A 5.0 kg box accelerates at 2.0 m/s² across a frictionless surface. The net force on it is:',opts:['2.5 N','7.0 N','10 N','40 N'],correct:2,feedback:'F = ma = 5.0 × 2.0 = 10 N. With no friction, the applied force equals the net force.'},
    {q:'A book rests on a table. The reaction to the book\'s weight (by Newton\'s 3rd law) is:',opts:['The normal force of the table on the book','The weight of the table on the floor','The gravitational pull of the book on Earth','The normal force of the book on the table'],correct:2,feedback:'The book\'s weight is the gravitational pull of Earth on the book. By Newton\'s 3rd law, the reaction is the gravitational pull of the book on Earth — equal magnitude, opposite direction, on a different object.'},
    {q:'A 2.0 kg block is on a surface with μₖ = 0.40. The kinetic friction force is: (g = 9.81 m/s²)',opts:['0.80 N','4.9 N','7.8 N','19.6 N'],correct:2,feedback:'f = μₖN = μₖmg = 0.40 × 2.0 × 9.81 = 7.85 ≈ 7.8 N.'}
  ]},

  // ── LESSON 6: Work, Energy & Power ───────────────────────────────────────────
  {type:'lesson',tag:'Lesson 6 of 10 · Work, Energy & Power',title:'Work, Energy & Power',
  subtitle:'Energy is the currency of physics. Work transfers energy from one store to another. Power is how quickly this happens.',
  body:`
<h3>Work</h3>
<p>Work is done when a force causes displacement in the direction of the force.</p>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2;margin:0">
    W = Fs cosθ &nbsp;&nbsp; (joules, J)<br>
    where θ = angle between F and displacement
  </p>
</div>
<p>If force is perpendicular to displacement (θ = 90°), <strong>no work is done</strong> — e.g. a satellite in circular orbit, or the normal force on a moving object.</p>
<h3>Kinetic & Potential Energy</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2;margin:0">
    Eₖ = ½mv² &nbsp;&nbsp; (kinetic energy)<br>
    Eₚ = mgh &nbsp;&nbsp;&nbsp; (gravitational PE, near surface)
  </p>
</div>
<h3>Work-Energy Theorem</h3>
<p>The net work done on an object equals its change in kinetic energy:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">Wₙₑₜ = ΔEₖ = ½mv² − ½mu²</p>
<h3>Conservation of Energy</h3>
<p>In a closed system with no friction, total mechanical energy (KE + PE) is constant. When friction acts, the lost mechanical energy becomes thermal energy.</p>
<h3>Power</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2;margin:0">
    P = W/t = Fv &nbsp;&nbsp; (watts, W)<br>
    efficiency η = P_useful / P_input × 100%
  </p>
</div>`},

  // ── QUIZ 5 ──────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lesson 6',title:'Work, Energy & Power — Check Your Understanding',
  questions:[
    {q:'A 3.0 kg ball falls 5.0 m. Its gain in kinetic energy is: (g = 9.81 m/s²)',opts:['15 J','29.4 J','147 J','196 J'],correct:2,feedback:'Gain in KE = loss in PE = mgh = 3.0 × 9.81 × 5.0 = 147 J (assuming no air resistance).'},
    {q:'A force of 40 N moves an object 6.0 m at 60° to the force. The work done is:',opts:['120 J','208 J','240 J','416 J'],correct:0,feedback:'W = Fs cosθ = 40 × 6.0 × cos60° = 240 × 0.5 = 120 J.'},
    {q:'An engine produces a driving force of 800 N at a constant speed of 25 m/s. Its power output is:',opts:['32 W','800 W','20 000 W','32 000 W'],correct:2,feedback:'P = Fv = 800 × 25 = 20 000 W = 20 kW. At constant speed the driving force equals the resistance forces.'}
  ]},

  // ── LESSON 7: Momentum & Impulse ─────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 7 of 10 · Momentum & Impulse',title:'Momentum & Impulse',
  subtitle:'Momentum is a conserved vector quantity that describes the "quantity of motion" of an object. Impulse is what changes it.',
  body:`
<h3>Linear Momentum</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0">
  <p style="font-family:'Space Mono',monospace;font-size:13px;color:#cccce0;line-height:2;margin:0">
    p = mv &nbsp;&nbsp; (kg m s⁻¹ or N s)
  </p>
</div>
<p>Momentum is a vector — direction matters. Newton's 2nd law in its more general form: <strong>F = Δp/Δt</strong> (rate of change of momentum).</p>
<h3>Impulse</h3>
<p>Impulse J = FΔt = Δp (the change in momentum). The area under a force-time graph gives the impulse.</p>
<div style="background:rgba(79,216,196,.06);border:1px solid rgba(79,216,196,.25);border-radius:8px;padding:14px 18px;margin:12px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.1em;margin-bottom:6px">WHY IMPULSE MATTERS</div>
  <p style="font-size:13px;color:#cccce0;margin:0">A large force for a short time, or a small force for a long time, can produce the same change in momentum. Car crumple zones extend collision time → reduce force → reduce injury.</p>
</div>
<h3>Conservation of Momentum</h3>
<p>In a closed system (no external forces), total momentum is conserved:</p>
<p style="font-family:'Space Mono',monospace;font-size:13px;background:var(--surface2);padding:10px 14px;border-radius:6px;color:#cccce0">Σp_before = Σp_after</p>
<p>This applies to all collisions and explosions. Momentum is a <em>vector</em> — in 2D problems, apply conservation separately in x and y directions.</p>`},

  // ── LESSON 8: Collision Types ────────────────────────────────────────────────
  {type:'lesson',tag:'Lesson 8 of 10 · Momentum & Impulse',title:'Types of Collision',
  subtitle:'All collisions conserve momentum. But kinetic energy is only conserved in one special case. Knowing the difference matters for calculations.',
  body:`
<h3>Elastic Collisions</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0">Both <strong>momentum</strong> and <strong>kinetic energy</strong> are conserved.<br>
  Objects bounce apart without any energy loss.</p>
</div>
<h3>Inelastic Collisions</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0"><strong>Momentum</strong> is conserved. <strong>Kinetic energy is not</strong> — some is converted to thermal energy, sound, or deformation.</p>
</div>
<h3>Perfectly Inelastic Collisions</h3>
<div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:10px 0">
  <p style="font-size:14px;color:#cccce0;margin:0">Objects <strong>stick together</strong> after colliding and move with a common final velocity. Maximum kinetic energy is lost (consistent with momentum conservation).</p>
  <p style="font-family:'Space Mono',monospace;font-size:12px;color:var(--accent2);margin-top:8px">m₁u₁ + m₂u₂ = (m₁ + m₂)v</p>
</div>
<div style="background:rgba(247,163,92,.06);border:1px solid rgba(247,163,92,.25);border-radius:8px;padding:14px 18px;margin:10px 0">
  <div style="font-size:11px;font-weight:700;color:var(--accent3);letter-spacing:.1em;margin-bottom:6px">KEY EXAM SKILL</div>
  <p style="font-size:13px;color:#cccce0;margin:0">To check if a collision is elastic: calculate total KE before and after. If they are equal → elastic. If total KE decreases → inelastic. Total KE can never <em>increase</em> in a collision.</p>
</div>`},

  // ── QUIZ 6 ──────────────────────────────────────────────────────────────────
  {type:'quiz',tag:'Quick Check · Lessons 7–8',title:'Momentum & Collisions — Check Your Understanding',
  questions:[
    {q:'A 0.40 kg ball moving at 8.0 m/s hits a wall and bounces back at 6.0 m/s. The magnitude of its change in momentum is:',opts:['0.80 N s','2.0 N s','3.2 N s','5.6 N s'],correct:3,feedback:'|Δp| = m|v − u| = 0.40 × |−6.0 − 8.0| = 0.40 × 14 = 5.6 N s. Note the sign change since direction reverses.'},

  ]},
